name: Inverter flow check
on:
  workflow_dispatch:
  push:
    branches: [codex/inverter-full-flow]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ventus/wiring
            .github/tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check scripts
        run: |
          node --check ventus/wiring/inverter-48.mjs
          node --check ventus/wiring/inverter-48-native.mjs
      - name: Check animation in hosted Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-save --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright" node .github/tests/inverter-flow.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inverter-flow-evidence
          path: inverter-flow-evidence
