name: Deploy GlobalGrid2050 Pages

on:
  workflow_dispatch:
  # Commits pushed by the V6 workflow use GITHUB_TOKEN and therefore do not emit a
  # second push workflow. Deploy the validated main branch when that workflow finishes.
  workflow_run:
    workflows: ["UK Renewables V6 REPD-Bound Newspaper"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'CNAME'
      - 'employers_competence/**'
      - 'solar_deployment_statistics/**'
      - 'solar_components/**'
      - 'uk_renewables_pipeline/**'
      - 'dist/major_project_news_v5.json'
      - 'dist/major_projects_v5.json'
      - 'dist/major_project_news_v6.json'
      - 'dist/major_projects_v6.json'
      - 'dist/project_identity_v6.json'
      - 'dist/project_identity_v6_integrity.json'
      - 'dist/project_news_links_v6.json'
      - 'dist/repd_source_reconciliation_v6.json'
      - 'dist/renewables_v6_integrity.json'
      - 'dist/manifest_v6.json'
      - 'dist/repd_master.json'
      - 'dist/manifest_v4.json'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      deployed_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Record deployed commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Mark Pages deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.source.outputs.sha }}
        run: |
          gh api --method POST \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=pending \
            -f context='globalgrid/pages-deploy' \
            -f description='GlobalGrid2050 Pages deployment running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Publish Pages deployment result
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.build.outputs.deployed_sha || github.sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [[ "$BUILD_RESULT" == "success" && "$DEPLOY_RESULT" == "success" ]]; then
            state=success
            description='GlobalGrid2050 Pages deployment passed'
          elif [[ "$BUILD_RESULT" == "cancelled" || "$DEPLOY_RESULT" == "cancelled" ]]; then
            state=error
            description='GlobalGrid2050 Pages deployment cancelled'
          else
            state=failure
            description='GlobalGrid2050 Pages deployment failed'
          fi
          gh api --method POST \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='globalgrid/pages-deploy' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
