# UK live grid tracker for globalgrid2050.com
# RETIRED LEGACY WORKFLOW.
# V1 is preserved for historical reference and manual recovery only.
# Scheduled live updates have been disabled so active capacity is focused on V4 and V5.

name: fetch_uk_energy_and_prices

on:
  workflow_dispatch:
    inputs:
      slice:
        description: 'Which slice to run when triggered manually'
        required: true
        default: 'both'
        type: choice
        options: [both, energy, price]

permissions:
  contents: write
  actions: write

concurrency:
  group: uk-energy-tracking
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Determine slice
        id: which
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slice=${{ github.event.inputs.slice }}" >> "$GITHUB_OUTPUT"
          else
            echo "slice=both" >> "$GITHUB_OUTPUT"
          fi

      - name: Run energy slice (manual legacy recovery)
        if: steps.which.outputs.slice == 'energy' || steps.which.outputs.slice == 'both'
        run: python scripts/update_uk_energy.py

      - name: Run price slice (manual legacy recovery)
        if: steps.which.outputs.slice == 'price' || steps.which.outputs.slice == 'both'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE_UK_PRICE=1 python scripts/update_uk_price.py
          else
            python scripts/update_uk_price.py
          fi

      - name: Commit and push changes
        run: |
          set -e

          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"

          if [ -f uk_energy_tracking/live_grid_energy.json ]; then
            git add uk_energy_tracking/live_grid_energy.json
          else
            echo "live_grid_energy.json not present for this run"
          fi

          if [ -f uk_energy_tracking/live_grid_price.json ]; then
            git add uk_energy_tracking/live_grid_price.json
          else
            echo "live_grid_price.json not present for this run"
          fi

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Manual legacy UK grid update (${{ steps.which.outputs.slice }}): $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
