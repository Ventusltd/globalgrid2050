name: Repair V6 Price Annotation Layout

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run repair
        run: python scripts/repair_v6_price_annotation_layout.py

      - name: Commit repair
        run: |
          git config user.name "GridBot"
          git config user.email "actions@users.noreply.github.com"
          git add uk_energy_tracking_v6/price_history_chart/render_price_chart/render_price_chart.js
          git add uk_energy_tracking_v6/index.md
          git add uk_energy_tracking_v6/V6_REPAIR_PRICE_ANNOTATION_LAYOUT_REPORT.md
          git diff --cached --quiet && exit 0
          git commit -m "Repair V6 price annotation layout"
          git push
