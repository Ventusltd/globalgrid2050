name: Repair V6 Restore V5 Panels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run V6 restore panels repair
        run: python scripts/repair_v6_restore_v5_panels.py

      - name: Commit controlled V6 repair
        run: |
          git config user.name "GridBot"
          git config user.email "gridbot@users.noreply.github.com"
          git add uk_energy_tracking_v6/index.md
          git add uk_energy_tracking_v6/styles/app.css
          git add uk_energy_tracking_v6/live_data_pipeline/live-config.js
          git add uk_energy_tracking_v6/commodity_price_signals/render_commodities/render_commodities.js
          git add uk_energy_tracking_v6/app_bootstrap/start_v6_app/start_v6_app.js
          git add uk_energy_tracking_v6/frequency_history/frequency-history-ui.js
          git add uk_energy_tracking_v6/V6_REPAIR_RESTORE_V5_PANELS_REPORT.md
          git diff --cached --quiet && echo "No V6 restore panel changes to commit" && exit 0
          git commit -m "Repair V6 restore V5 panels"
          git push
