name: 202608300424 Feature current verified Grid Atlas V9 on homepage

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/202608300424-feature-current-gridatlas-homepage.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: globalgrid2050-homepage-current-gridatlas-v9
  cancel-in-progress: false

jobs:
  feature-current-gridatlas:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 20
          persist-credentials: true

      - name: Put verified Atlas V9 in the visible homepage launch area
        env:
          RELEASE_ID: 202608292311-atlas-v9
          RELEASE_URL: https://ventusltd.github.io/gridatlas/202608292311-atlas-v9/
          WORKFLOW_PATH: .github/workflows/202608300424-feature-current-gridatlas-homepage.yml
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main

          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          anchor = '      <div class="os-strip"><a href="https://ventusltd.github.io/reports/studio/">Reports Dashboard</a><span class="dev-status">Save As / evidence layer</span></div>\n'
          visible = '      <div class="os-strip"><a href="https://ventusltd.github.io/gridatlas/202608292311-atlas-v9/">UK Grid Atlas V9 — Current Verified Release</a><span class="live-status">202608292311 · verified live</span></div>\n'
          drawer = '    { name:"UK Grid Atlas V9 — Current Verified Release", url:"https://ventusltd.github.io/gridatlas/202608292311-atlas-v9/", note:"CURRENT VERIFIED · 202608292311-atlas-v9 · actual 400 kV render gates · desktop/mobile · canonical repd_ref deep links · V8 and immutable prior V9 releases preserved" },'

          if text.count(anchor) != 1:
              raise SystemExit('Reports Dashboard homepage anchor is not unique')
          if text.count(drawer) != 1:
              raise SystemExit('Verified Atlas V9 drawer entry is absent or duplicated')
          if text.count(visible) > 1:
              raise SystemExit('Visible Atlas V9 homepage entry is duplicated')
          if visible not in text:
              text = text.replace(anchor, anchor + visible, 1)

          if text.index(visible) > text.index('<input type="text" id="gridSearch"'):
              raise SystemExit('Atlas V9 entry is not in the visible launch area')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          test "$(grep -c 'UK Grid Atlas V9 — Current Verified Release</a><span class="live-status">202608292311 · verified live' index.html)" = 1
          rm "$WORKFLOW_PATH"
          git add index.html "$WORKFLOW_PATH"
          git diff --cached --check
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(.github/workflows/202608300424-feature-current-gridatlas-homepage.yml index.html)
          test "${staged[*]}" = "${expected[*]}"

          git config user.name globalgrid2050-homepage-bot
          git config user.email actions@users.noreply.github.com
          git commit -m "homepage: feature current verified Grid Atlas V9 202608292311"
          git push origin main

      - name: Request GitHub Pages rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
