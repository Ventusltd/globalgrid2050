name: Pipeline News V9.65 native expanded REPD acceptance
on:
  pull_request:
    paths:
      - 'uk_renewables_pipeline/202611221330/**'
      - '.github/workflows/pn-v965-expanded-repd.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expanded-repd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify original V9.64 source and V9.63 A4 byte identity
        run: |
          python3 - <<'PY'
          import subprocess
          root='uk_renewables_pipeline/'
          def entries(v):
            raw=subprocess.check_output(['git','ls-tree','-r','-z','HEAD:'+root+v])
            return {p.decode():a.split()[2].decode() for a,p in (obj.split(b'\t',1) for obj in raw.split(b'\0') if obj)}
          old=entries('202611221243');new=entries('202611221330')
          changed={x for x in old.keys()|new.keys() if old.get(x)!=new.get(x)}
          permitted={'index.html','scripts/plugins/projects-v9-8.js','README.md','CHANGES.md','repd-expanded.mjs','styles/repd-expanded.css','tests/repd-expanded.mjs'}
          assert changed==permitted,(changed,permitted)
          for name in ['report-a4.mjs','report-model.mjs','report-pdf.mjs','styles/report-a4.css','repd-scan.mjs','repd-density.mjs','repd-landscape.mjs']:
            assert old[name]==new[name],name
          for section in ['data/','news/','vendor/','gridatlas/','solar1000/']:
            assert {k:v for k,v in old.items() if k.startswith(section)}=={k:v for k,v in new.items() if k.startswith(section)},section
          print('PASS native source-byte guard; inherited A4/PDF/data/map/notes/analytics kept')
          PY
      - name: Audit V9.65 code-line delta against V9.64 and V9.63
        run: |
          mkdir -p /tmp/pn-v965-delta
          python3 - <<'PY'
          import subprocess,json,difflib,pathlib,os
          root='uk_renewables_pipeline/'
          a=root+'202611221243/'
          b=root+'202611221330/'
          def listing(prefix):
            raw=subprocess.check_output(['git','ls-tree','-r','-z','HEAD:'+prefix])
            return {p.decode():m.split()[2].decode() for m,p in
                    (entry.split(b'\t',1) for entry in raw.split(b'\0') if entry)}
          left,right=listing(a),listing(b)
          records=[]
          for path in sorted(left.keys()|right.keys()):
            if left.get(path)==right.get(path):continue
            def read(prefix):
              if path not in (left if prefix==a else right):return []
              return subprocess.check_output(['git','show',f'HEAD:{prefix}{path}']).decode('utf-8').splitlines()
            old,new=read(a),read(b)
            blocks=difflib.SequenceMatcher(a=old,b=new,autojunk=False).get_opcodes()
            added=sum(j2-j1 for tag,i1,i2,j1,j2 in blocks if tag in ('replace','insert'))
            removed=sum(i2-i1 for tag,i1,i2,j1,j2 in blocks if tag in ('replace','delete'))
            records.append(dict(path=path,old_lines=len(old),new_lines=len(new),
                                added=added,deleted=removed,
                                old_sha=left.get(path),new_sha=right.get(path)))
          assert len(records)==7, records
          for prefix in ('scripts/core/','data/','news/','solar1000/','gridatlas/','vendor/'):
            assert {k:v for k,v in left.items() if k.startswith(prefix)}=={
                   k:v for k,v in right.items() if k.startswith(prefix)},prefix
          a4=listing(root+'202611220220/')
          for path in ('report-a4.mjs','report-model.mjs','report-pdf.mjs','styles/report-a4.css'):
            assert left[path]==right[path]==a4[path],path
          total=dict(added=sum(x['added'] for x in records),
                     deleted=sum(x['deleted'] for x in records),
                     changed_files=len(records),
                     inherited_identical_files=len(set(left)|set(right))-len(records))
          report={'base':'V9.64 (202611221243)','candidate':'V9.65 (202611221330)',
                  'rollback':'V9.63 (202611220220)','line_delta':total,'files':records}
          pathlib.Path('/tmp/pn-v965-delta/line-delta.json').write_text(json.dumps(report,indent=2)+'\n')
          with open(pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']),'a') as fh:
            fh.write('## V9.65 vs V9.64 actual code change\n\n')
            fh.write(f"**{total['added']} added / {total['deleted']} removed source lines in {len(records)} changed files.**\n\n")
            fh.write(f"**{total['inherited_identical_files']} inherited files unchanged. V9.63 per-project A4/PDF SHA-identical.**\n\n")
            fh.write('| File | Added | Removed | New lines |\n|---|---:|---:|---:|\n')
            for item in records:
              fh.write(f"| {item['path']} | {item['added']} | {item['deleted']} | {item['new_lines']} |\n")
          print(json.dumps(total))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and WebKit
        working-directory: uk_renewables_pipeline/202611221330
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Browser test native table and A4 restoration
        run: |
          python3 -m http.server 8765 >/tmp/pn-v965-http.log 2>&1 &
          node uk_renewables_pipeline/202611221330/tests/repd-expanded.mjs
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pn-v965-native-expanded-REPD
          path: |
            /tmp/pn-v965-native/
            /tmp/pn-v965-delta/
          retention-days: 14
