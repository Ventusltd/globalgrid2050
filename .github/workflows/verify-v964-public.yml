name: Verify V9.64 public HTML overview, source A4 rollback and homepage bytes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-v964-public.yml'
      - 'index.html'
      - 'homepage-shell/**'
      - 'uk_renewables_pipeline/202611221243/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  served:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - name: Verify release metadata, exact source inheritance and actual public SHA256 bytes
        env:
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import hashlib,json,os,time
          root=Path('.')
          new='uk_renewables_pipeline/202611221243/'
          prior='uk_renewables_pipeline/202611220220/'
          owner=json.loads((root/'homepage-shell/data/homepage.json').read_text())
          pn=next(e for e in owner['entities'] if e['id']=='pipeline-news')
          assert pn['operative_release_id']=='202611221243', 'Wrong operative Pipeline News version'
          assert len(pn['releases'])==31, 'Unexpected immutable release catalogue length'
          assert any(e['id']=='202611220220' and e['status']=='available' for e in pn['releases']), 'V9.63 A4 rollback missing'
          assert any(e['id']=='202611212344' and e['status']=='available' for e in pn['releases']), 'V9.60 rollback missing'
          assert '202611221243' in (root/'index.html').read_text(), 'Homepage does not link V9.64'
          assert 'Project, capacity and MAP prospect scan' not in (root/'index.html').read_text(), 'Unapproved reserved word in homepage'
          assert (root/(new+'repd-liquid.mjs')).is_file()
          assert (root/(new+'styles/repd-liquid.css')).is_file()
          for name in ['report-a4.mjs','report-model.mjs','report-pdf.mjs','styles/report-a4.css']:
              assert (root/(new+name)).read_bytes()==(root/(prior+name)).read_bytes(), 'V9.63 original A4 was modified: '+name
          files=[
              'index.html',
              'homepage-shell/data/homepage.json',
              'homepage-shell/assets/versioned-homepage.js',
              new+'index.html',
              new+'repd-liquid.mjs',
              new+'styles/repd-liquid.css',
              new+'report-a4.mjs',
              new+'report-pdf.mjs',
              prior+'index.html',
              prior+'report-a4.mjs',
              prior+'report-pdf.mjs',
              'uk_renewables_pipeline/202611212344/index.html',
          ]
          hashes={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in files}
          sha=os.environ.get('SHA','unknown')[:12]
          for attempt in range(1,71):
              bad=[]
              # First probe the operative homepage, then confirm every artifact only when it is live.
              inspect=files if attempt==1 else files[:2]
              for path in inspect:
                  url='https://globalgrid2050.com/'+path+'?v964='+sha+'-'+str(attempt)
                  req=Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache',
                    'Accept-Encoding':'identity','User-Agent':'GlobalGrid2050-V964-Public-CI/1.0'})
                  try:
                      with urlopen(req,timeout=16) as response:
                          data=response.read(2000000)
                          status=response.status
                      digest=hashlib.sha256(data).hexdigest()
                      if status!=200 or digest!=hashes[path]:
                          bad.append(f'{path}: HTTP {status}; SHA256 {digest}, expected {hashes[path]}')
                  except Exception as exc:
                      bad.append(f'{path}: {type(exc).__name__}: {exc}')
              if not bad and inspect!=files:
                  for path in files[2:]:
                      url='https://globalgrid2050.com/'+path+'?v964='+sha+'-'+str(attempt)
                      req=Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache',
                        'Accept-Encoding':'identity','User-Agent':'GlobalGrid2050-V964-Public-CI/1.0'})
                      try:
                          with urlopen(req,timeout=16) as response:
                              data=response.read(2000000)
                              status=response.status
                          digest=hashlib.sha256(data).hexdigest()
                          if status!=200 or digest!=hashes[path]:
                              bad.append(f'{path}: HTTP {status}; SHA256 {digest}, expected {hashes[path]}')
                      except Exception as exc:
                          bad.append(f'{path}: {type(exc).__name__}: {exc}')
              if not bad:
                  print('PASS: all '+str(len(files))+' public V9.64 HTML/A4/rollback and homepage files match exact Git SHA256 bytes',flush=True)
                  break
              print('Attempt '+str(attempt)+'/70: '+str(len(bad))+' mismatch(es) '+str(bad[:3]),flush=True)
              if attempt==70:
                  raise SystemExit('FAIL V9.64 public source verification: '+str(bad))
              time.sleep(15)
          PY
