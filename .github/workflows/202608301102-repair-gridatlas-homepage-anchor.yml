name: 202608301102 Repair Grid Atlas homepage anchoring
run-name: Repair semantic Atlas V8 to V9 catalogue anchoring from ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/202608301102-repair-gridatlas-homepage-anchor.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: globalgrid2050-202608301102-homepage-anchor-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Patch stale literal anchor logic and hand off to governed publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact repair boundary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          persist-credentials: true

      - name: Apply bounded semantic catalogue repair
        run: |
          set -euo pipefail
          target=scripts/202608300232-sync-promoted-gridatlas-v9.py
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test -f "$target"
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/202608300232-sync-promoted-gridatlas-v9.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'def update_homepage\(homepage: Path, release_id: str\) -> None:\n.*?(?=\ndef main\(\) -> int:)', re.S)
          replacement = '''def update_homepage(homepage: Path, release_id: str) -> None:
              original = homepage.read_text(encoding="utf-8")
              generated_block = re.compile(
                  rf"(?is)\\s*/\\*\\s*{re.escape(START)}\\s*\\*/.*?/\\*\\s*{re.escape(END)}\\s*\\*/\\s*"
              )
              without_old = generated_block.sub("\\n", original)
              without_old = re.sub(
                  rf"(?is)\\s*{re.escape(START)}.*?{re.escape(END)}\\s*",
                  "\\n",
                  without_old,
              )

              # Remove only the mutable semantic current-release catalogue row. Historical V9 rows remain immutable.
              current_row = re.compile(
                  r'(?m)^[ \\t]*\\{[^\\n]*name\\s*:\\s*(["\\\'])UK Grid Atlas V9 — Current Verified Release\\1[^\\n]*\\},?\\s*$'
              )
              without_old = current_row.sub("", without_old)

              html_matches = list(V8_ANCHOR.finditer(without_old))
              if html_matches:
                  match = html_matches[0]
                  v9_anchor = build_v9_anchor(match.group(0), release_id)
                  block = f"\\n{START}\\n{v9_anchor}\\n{END}"
                  updated = without_old[: match.end()] + block + without_old[match.end() :]
                  route_present = (
                      f'href="/{release_id}/"' in updated
                      or f"href='/{release_id}/'" in updated
                  )
              else:
                  # The current homepage catalogue is a JavaScript object array, not literal HTML anchors.
                  v8_row = re.compile(
                      r'(?m)^(?P<indent>[ \\t]*)\\{[^\\n]*url\\s*:\\s*(["\\\'])[^"\\\']*repd_grid_atlasv8/?\\2[^\\n]*\\},?\\s*$'
                  )
                  match = v8_row.search(without_old)
                  require(match is not None, "Atlas V8 homepage catalogue row not found")
                  indent = match.group('indent')
                  generation = release_id.split('-', 1)[0]
                  block = (
                      f"\\n{indent}/* {START} */\\n"
                      f'{indent}{{ name:"UK Grid Atlas V9 — Current Verified Release", '
                      f'url:"./{release_id}/", '
                      f'note:"CURRENT VERIFIED · {release_id} · actual 400 kV render gates · desktop/mobile · canonical repd_ref deep links · V8 and immutable prior V9 releases preserved", '
                      f'data_gridatlas_release:"{release_id}" }}, /* data-gridatlas-release="{release_id}" */\\n'
                      f"{indent}/* {END} */"
                  )
                  updated = without_old[: match.end()] + block + without_old[match.end() :]
                  route_present = f'url:"./{release_id}/"' in updated

                  # Keep the prominent current-release launch strip aligned with the same promoted pointer.
                  current_link = re.compile(
                      r'(<a\\s+href=)(["\\\'])[^"\\\']+\\2(>UK Grid Atlas V9 — Current Verified Release</a>)'
                  )
                  updated = current_link.sub(
                      lambda item: f'{item.group(1)}{item.group(2)}./{release_id}/{item.group(2)}{item.group(3)}',
                      updated,
                  )
                  current_strip = re.compile(
                      r'(<div class="os-strip"><a[^>]*>UK Grid Atlas V9 — Current Verified Release</a><span class="live-status">).*?(</span></div>)'
                  )
                  updated = current_strip.sub(
                      rf'\\g<1>{generation} · verified live\\g<2>',
                      updated,
                      count=1,
                  )

              require(updated.count(START) == 1 and updated.count(END) == 1, "V9 catalogue marker closure mismatch")
              require(
                  updated.find("repd_grid_atlasv8") < updated.find(f'data-gridatlas-release="{release_id}"'),
                  "V8/V9 catalogue order is wrong",
              )
              require(route_present, "V9 homepage route missing")
              homepage.write_text(updated, encoding="utf-8", newline="\\n")
          '''
          updated, count = pattern.subn(replacement.rstrip() + '\n\n', text, count=1)
          assert count == 1, f'expected one update_homepage function, found {count}'
          path.write_text(updated, encoding='utf-8', newline='\n')
          PY
          python3 -m py_compile "$target"
          git diff --check
          test "$(git diff --name-only)" = "$target"

      - name: Compare-and-swap repaired publisher onto main
        run: |
          set -euo pipefail
          target=scripts/202608300232-sync-promoted-gridatlas-v9.py
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add "$target"
          test "$(git diff --cached --name-only)" = "$target"
          git config user.name globalgrid-homepage-anchor-repair-bot
          git config user.email actions@users.noreply.github.com
          git commit -m '202608301102: make Atlas V9 catalogue publication semantic and idempotent'
          git push origin HEAD:main
