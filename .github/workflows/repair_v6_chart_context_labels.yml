name: Repair V6 Chart Context Labels

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply chart context label repair and commit changes
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
permissions:
  contents: write

concurrency:
  group: repair-v6-chart-context-labels
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run repair script
        run: python scripts/repair_v6_chart_context_labels.py

      - name: Commit controlled repair
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          set -e
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"
          git add \
            uk_energy_tracking_v6/price_history_chart/render_price_chart/render_price_chart.js \
            data/grid_studies_public/great_britain_electricity_price_grid_constraint_trends_2016_2026.html \
            uk_energy_tracking_v6/V6_REPAIR_CHART_CONTEXT_LABELS_REPORT.md
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Repair V6 chart context labels"
            git pull --rebase https://${PAT}@github.com/${{ github.repository }}.git main
            git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
          else
            echo "No repair changes to commit"
          fi
