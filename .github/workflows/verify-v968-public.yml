name: Verify V9.68 active Pipeline News public bytes
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'homepage-shell/data/homepage.json'
      - 'catalogue/homepage-owner.json'
      - '.github/workflows/verify-v968-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  served:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test CDN HTTP 200 and exact bytes for V9.68, homepage and rollback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import json,hashlib,time,os
          root=Path('.')
          cfg=json.loads((root/'homepage-shell/data/homepage.json').read_text())
          p=next(e for e in cfg['entities'] if e['id']=='pipeline-news')
          assert p['operative_release_id']=='202611221705' and len(p['releases'])==35
          assert p['releases'][-1]['id']=='202611221705'
          assert p['releases'][-2]['id']=='202611221625'
          assert cfg['promotions'][-1]['to_release_id']=='202611221705'
          assert '202611221705' in (root/'index.html').read_text()
          fresh='uk_renewables_pipeline/202611221705/'
          old='uk_renewables_pipeline/202611221625/'
          for name in ['report-a4.mjs','report-pdf.mjs','styles/report-a4.css']:
              assert (root/(fresh+name)).read_bytes()==(root/(old+name)).read_bytes()
          paths=['index.html','homepage-shell/data/homepage.json',
                 fresh+'index.html',fresh+'repd-expanded.mjs',
                 fresh+'styles/repd-expanded.css',fresh+'report-a4.mjs',
                 fresh+'report-pdf.mjs',old+'index.html',old+'report-a4.mjs']
          expected={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in paths}
          for iteration in range(1,45):
              bad=[]
              for name,digest in expected.items():
                  url='https://globalgrid2050.com/'+name+'?verify968='+os.getenv('GITHUB_SHA','x')[:9]+'-'+str(iteration)
                  try:
                      with urlopen(Request(url,headers={'Cache-Control':'no-cache','Accept-Encoding':'identity','User-Agent':'Ventus-V968-CD'}),timeout=20) as response:
                          if response.status!=200 or hashlib.sha256(response.read(4000000)).hexdigest()!=digest:
                              bad.append(name+' status or byte mismatch')
                  except Exception as exc: bad.append(name+': '+str(exc))
              if not bad:
                  print('PASS: public V9.68 HTTP 200, all 9/9 exact bytes, homepage and V9.67 rollback',flush=True)
                  break
              print(f'Attempt {iteration}/44: {len(bad)} problems: {bad[:4]}',flush=True)
              if iteration==44: raise SystemExit('V9.68 not verified: '+repr(bad))
              time.sleep(10)
          PY
