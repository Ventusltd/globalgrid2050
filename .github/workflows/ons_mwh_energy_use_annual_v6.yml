name: Update ONS MWh Energy Use Annual V6

on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: ons-mwh-energy-use-annual-v6
  cancel-in-progress: true

jobs:
  update_ons_mwh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download and normalise ONS MWh energy use workbook
        run: |
          python scripts/download_ons_mwh_energy_use_v6.py

      - name: Commit ONS MWh energy use data
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          set -e
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"
          git add data/ons/11energyusebyindustrysourceandfuel.xlsx uk_energy_tracking_v6/generation_history/mwh_energy_use/ons_mwh_energy_use_annual.json uk_energy_tracking_v6/generation_history/mwh_energy_use/ons_mwh_summary_top_uses_latest.json uk_energy_tracking_v6/generation_history/mwh_energy_use/ons_mwh_summary_by_fuel.json uk_energy_tracking_v6/generation_history/mwh_energy_use/ONS_MWH_ENERGY_USE_REPORT.md
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update ONS MWh energy use data"
            git pull --rebase https://${PAT}@github.com/${{ github.repository }}.git main
            git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
          else
            echo "No ONS MWh energy use changes"
          fi
