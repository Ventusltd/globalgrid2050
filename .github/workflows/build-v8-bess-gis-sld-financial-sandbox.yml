name: Build V8 BESS GIS SLD Financial Sandbox

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v8-bess-gis-sld-financial-sandbox:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GRIDBOT_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build V8 BESS GIS SLD Financial Sandbox
        run: python scripts/build_v8_bess_gis_sld_financial_sandbox.py

      - name: Run V8 BESS GIS SLD checks
        run: python scripts/test_build_v8_bess_gis_sld_financial_sandbox.py

      - name: Commit and push V8 BESS GIS SLD Financial Sandbox
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"

          git pull --rebase --autostash origin main

          git add \
            solar-bess-topology-v8/index.html \
            solar-bess-topology-v8/README.md \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/index.html \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/bess-gis-sld-financial-sandbox.css \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/bess-gis-sld-financial-sandbox.js \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/README.md \
            solar-bess-topology-v8/bess-pcs-standalone/index.html \
            scripts/build_v8_bess_gis_sld_financial_sandbox.py \
            scripts/test_build_v8_bess_gis_sld_financial_sandbox.py \
            gridbot_reports/build_v8_bess_gis_sld_financial_sandbox.md

          if git diff --cached --quiet; then
            echo "No V8 BESS GIS SLD changes to commit."
            exit 0
          fi

          git commit -m "Build V8 BESS GIS SLD financial sandbox"
          git pull --rebase --autostash origin main
          git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
