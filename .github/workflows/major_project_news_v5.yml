name: UK Renewables V5 Newspaper

# Live V5 newspaper refresh. Six-month horizon, three-minute execution ceiling.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/major_project_news_v5.py'
      - 'scripts/validate_renewables_v5_integrity.py'
      - '.github/workflows/major_project_news_v5.yml'
      - 'uk_renewables_pipeline/dashboard_v5_live.html'
      - 'dist/repd_master.json'
permissions:
  contents: write
concurrency:
  group: uk-renewables-v5-newspaper
  cancel-in-progress: true
jobs:
  refresh-newspaper:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Measure V1-V5 and block truncation
        run: python scripts/validate_renewables_v5_integrity.py
      - name: Build six-month REPD major-project newspaper
        run: python scripts/major_project_news_v5.py
      - name: Validate generated newspaper before publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('dist/major_project_news_v5.json').read_text(encoding='utf-8')); items=d.get('items') or []; eligible=d.get('eligible_projects'); count=d.get('headline_count'); sources=set(d.get('priority_sources') or []); required={'BBC','Solar Power Portal','Energy-Storage.News','PV Magazine'}
          assert isinstance(eligible,int) and eligible>0
          assert isinstance(count,int) and count==len(items)
          assert len(items)>=5, f'only {len(items)} headlines generated'
          assert required.issubset(sources)
          assert 180 <= int(d.get('lookback_days') or 0) <= 184
          for i,item in enumerate(items):
              assert item.get('project') and item.get('headline') and item.get('url')
              assert item.get('technology') in {'solar','bess'}
              mw=float(item.get('capacity_mw') or 0)
              assert mw>49 if item['technology']=='solar' else mw>100
          print(f'NEWSPAPER PASS: {eligible} eligible; {len(items)} headlines; {d.get("lookback_days")} days')
          PY
      - name: Re-check V5 integrity after newspaper build
        run: python scripts/validate_renewables_v5_integrity.py
      - name: Commit only validated newspaper changes
        run: |
          git config user.name "Ventus-Bot"
          git config user.email "bot@ventus.ltd"
          git add dist/major_projects_v5.json dist/major_project_news_v5.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V5 newspaper refresh: $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
