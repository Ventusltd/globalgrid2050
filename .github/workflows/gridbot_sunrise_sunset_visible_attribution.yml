name: GridBot Sunrise Sunset Visible Attribution

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
      commit_reports:
        description: Commit reports and apply outputs
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

concurrency:
  group: gridbot-sunrise-sunset-visible-attribution
  cancel-in-progress: false

jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT }}

      - name: Sync latest main before processing
        run: git pull --ff-only origin main

      - name: Run audit
        if: ${{ github.event.inputs.mode == 'audit' }}
        run: python scripts/gridbot_sunrise_sunset_visible_attribution.py

      - name: Run apply
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: python scripts/gridbot_sunrise_sunset_visible_attribution.py --apply

      - name: Upload visible attribution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-sunset-visible-attribution-${{ github.event.inputs.mode }}
          path: |
            data_science_protocol/audit_reports/SUNRISE_SUNSET_VISIBLE_ATTRIBUTION_LATEST.md
            data_science_protocol/audit_reports/json/SUNRISE_SUNSET_VISIBLE_ATTRIBUTION_LATEST.json

      - name: Commit audit report only
        if: ${{ github.event.inputs.commit_reports == 'true' && github.event.inputs.mode == 'audit' }}
        run: |
          git config user.name "Gridbot"
          git config user.email "gridbot@users.noreply.github.com"
          git add scripts/gridbot_sunrise_sunset_visible_attribution.py
          git add .github/workflows/gridbot_sunrise_sunset_visible_attribution.yml
          git add data_science_protocol/audit_reports/SUNRISE_SUNSET_VISIBLE_ATTRIBUTION_LATEST.md
          git add data_science_protocol/audit_reports/json/SUNRISE_SUNSET_VISIBLE_ATTRIBUTION_LATEST.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "gridbot: sunrise sunset visible attribution audit"
            git push origin HEAD:main
          fi

      - name: Commit visible attribution output and report
        if: ${{ github.event.inputs.commit_reports == 'true' && github.event.inputs.mode == 'apply' }}
        run: |
          git config user.name "Gridbot"
          git config user.email "gridbot@users.noreply.github.com"
          git add scripts/gridbot_sunrise_sunset_visible_attribution.py
          git add .github/workflows/gridbot_sunrise_sunset_visible_attribution.yml
          git add uk_energy_tracking_v6/generation_history/index.md
          git add data_science_protocol/audit_reports/SUNRISE_SUNSET_VISIBLE_ATTRIBUTION_LATEST.md
          git add data_science_protocol/audit_reports/json/SUNRISE_SUNSET_VISIBLE_ATTRIBUTION_LATEST.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "gridbot: sunrise sunset visible attribution apply"
            git push origin HEAD:main
          fi
