name: V9.29 modular Pipeline acceptance

on:
  pull_request:
    paths:
      - 'uk_renewables_pipeline/202611162354/**'
      - 'automation/v929_preview/**'
      # The published edition has an explicit runtime closure. Future release
      # registries are checked by Verify Pipeline News versions and their own
      # host suite; they do not alter this immutable V9.29 application.
      - 'automation/news/datacentre-ui/**'
      - 'automation/news/grid_watch/sources.json'
      - 'automation/v928_context/preview/**'
      - '.github/workflows/v929-preview-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v929-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      V929_BASE_SHA: d1baa7a9c20de78dc7e1995042df335c3212adbf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install existing locked test dependencies
        run: |
          git fetch --depth 1 origin "$V929_BASE_SHA" 8f94299afc8628908dc8bf461cb5ea607560332b
          python -m pip install pytest==9.2.0 duckdb==1.3.2
          npm ci --prefix automation/news/acquisition/browser --ignore-scripts
          npm exec --prefix automation/news/acquisition/browser -- playwright install --with-deps chromium
          echo "V929_OUT=$RUNNER_TEMP/v929-proof" >> "$GITHUB_ENV"
          echo "V929_PLAYWRIGHT=$GITHUB_WORKSPACE/automation/news/acquisition/browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Compact successor generation and reviewed module contracts
        run: |
          python -B -m pytest -q -p no:cacheprovider automation/pipeline_release/tests/test_compact_successor.py
          node --test automation/v929_preview/contracts.test.mjs
      - name: Exact module closure, immutable history, canonical rows and package budget
        run: node automation/v929_preview/invariants.mjs
      - name: Formal edition source and rebuilt data on Linux
        run: bash uk_renewables_pipeline/202611162354/tests/run_v9_29.sh
      - name: Integrated browser flows and source-failure isolation
        run: node automation/v929_preview/browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v929-exact-head-proof
          path: ${{ runner.temp }}/v929-proof
          retention-days: 14
