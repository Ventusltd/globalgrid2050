name: 202608301138 Cancel stale pre-repair Atlas sync
run-name: Cancel superseded readback wait 33306201392 from ${{ github.sha }}

on:
  push:
    branches:
      - 'ci/202608301132-gridatlas-pages-wake'
    paths:
      - '.github/workflows/202608301138-cancel-stale-gridatlas-sync.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel only the superseded pre-repair workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=33306201392
          payload="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          test "$(printf '%s' "$payload" | jq -r .path)" = '.github/workflows/202608300232-sync-promoted-gridatlas-v9.yml'
          status="$(printf '%s' "$payload" | jq -r .status)"
          if test "$status" != completed; then
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel"
          fi
