<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="color-scheme" content="dark">
<title>Wafer Galaxy - Navigate through our code without coding knowledge!</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="stage" aria-label="Every permanently numbered line of the estate's code, placed by its own number. Tap any particle to read its code."></canvas>

<header id="bar">
  <span id="wordmark">WAFER GALAXY</span>
  <span id="count" class="dim">reading the numbering...</span>
</header>

<section id="panel" hidden aria-labelledby="griptitle">
  <div id="grip">
    <span id="griptitle">line</span>
    <button id="min" type="button" aria-label="minimise the card" title="minimise">–</button>
    <button id="close" type="button" aria-label="close the card" title="close">✕</button>
  </div>
  <div id="panelbody"></div>
</section>

<button id="reopen" type="button" hidden aria-label="reopen the card">▣ card</button>

<footer id="foot"></footer>

<script type="module" src="nest.mjs"></script>
</body>
</html>
