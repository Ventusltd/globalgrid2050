name: GridBot Daily MWh Titles Labels

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
      commit_reports:
        description: Commit reports and title changes
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

concurrency:
  group: gridbot-daily-mwh-titles-labels
  cancel-in-progress: false

jobs:
  daily-mwh-titles-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT }}

      - name: Sync latest main before processing
        run: git pull --ff-only origin main

      - name: Run audit
        if: ${{ github.event.inputs.mode == 'audit' }}
        run: python scripts/gridbot_daily_mwh_titles_labels.py

      - name: Run apply
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: python scripts/gridbot_daily_mwh_titles_labels.py --apply

      - name: Upload title label report
        uses: actions/upload-artifact@v4
        with:
          name: daily-mwh-titles-labels-${{ github.event.inputs.mode }}
          path: |
            data_science_protocol/audit_reports/DAILY_MWH_TITLES_LABELS_LATEST.md
            data_science_protocol/audit_reports/json/DAILY_MWH_TITLES_LABELS_LATEST.json

      - name: Commit audit report only
        if: ${{ github.event.inputs.commit_reports == 'true' && github.event.inputs.mode == 'audit' }}
        run: |
          git config user.name "Gridbot"
          git config user.email "gridbot@users.noreply.github.com"
          git add scripts/gridbot_daily_mwh_titles_labels.py
          git add .github/workflows/gridbot_daily_mwh_titles_labels.yml
          git add data_science_protocol/audit_reports/DAILY_MWH_TITLES_LABELS_LATEST.md
          git add data_science_protocol/audit_reports/json/DAILY_MWH_TITLES_LABELS_LATEST.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "gridbot: daily mwh titles labels audit"
            git push origin HEAD:main
          fi

      - name: Commit title label changes and report
        if: ${{ github.event.inputs.commit_reports == 'true' && github.event.inputs.mode == 'apply' }}
        run: |
          git config user.name "Gridbot"
          git config user.email "gridbot@users.noreply.github.com"
          git add scripts/gridbot_daily_mwh_titles_labels.py
          git add .github/workflows/gridbot_daily_mwh_titles_labels.yml
          git add uk_energy_tracking_v6/generation_history/index.md
          git add data_science_protocol/audit_reports/DAILY_MWH_TITLES_LABELS_LATEST.md
          git add data_science_protocol/audit_reports/json/DAILY_MWH_TITLES_LABELS_LATEST.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "gridbot: daily mwh titles labels apply"
            git push origin HEAD:main
          fi
