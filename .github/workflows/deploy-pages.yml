name: Deploy GlobalGrid2050 Pages

on:
  workflow_dispatch:
  # Commits pushed by the V6 workflow use GITHUB_TOKEN and therefore do not emit a
  # second push workflow. Deploy the validated main branch when that workflow finishes.
  workflow_run:
    workflows: ["UK Renewables V6 REPD-Bound Newspaper"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/import_homepage_owner.py'
      - 'homepage-shell/**'
      - 'testcode/**'
      # The Kuiper and Real Systems now live at permanent addresses, /kuiper/ and /systems/,
      # as an immutable shell plus hashed cartridges behind current.json. Neither folder was in
      # this list, so on 2026-09-20 the first shell release (k0031) triggered no deploy at all and
      # /kuiper/ sat at HTTP 404 for seven minutes until a deploy was started by hand; the next
      # cartridge then blocked the release timer, which waits for published bytes. Third time
      # this file has learned the same lesson: a folder that is published must be listed here.
      - 'kuiper/**'
      - 'systems/**'
      # The compute method page is published from its own folder at /compute/.
      # Fourth time this file learns the lesson: on 2026-09-21 it went live as a
      # 404 because the folder was not listed here, and the manual dispatches
      # that would have covered it were cancelled by the concurrency group.
      - 'compute/**'
      # FIFTH TIME. The Kuiper grid builds are published from kuiper-grid/, a
      # different folder from kuiper/, and it was not in this list - so i0092
      # was pushed, gated, hashed and merged on 21 September and the live site
      # went on showing i0091. Nothing failed. No run went red. The commit said
      # PUBLISHED and the page said otherwise, which is the worst shape a
      # failure can take.
      #
      # THIS LIST IS THE BUG. An allow-list of published folders has now been
      # wrong five times, and it will be wrong again the next time a folder is
      # added, because nothing anywhere checks that the two agree. It should be
      # inverted to paths-ignore, so a new published folder deploys by default
      # and only what is deliberately excluded does not. Left as a list for now
      # because inverting it changes how often this deploys, and that is a
      # decision about the runners, not a typo fix.
      - 'kuiper-grid/**'
      # SIXTH TIME, and added WITH the folder rather than after it. The
      # comments above count to five because each was found by a page
      # being published and not appearing. This one is listed before
      # anything is served from it.
      - 'plant/**'
      - 'ventus/**'
      - 'why_ventusltd_building_globalgrid2050/**'
      # A new PipelineNews release is a directory under uk_renewables_pipeline.
      # It was NOT in this list, so a push that only added a release triggered
      # no deploy at all: 202609061329 sat at HTTP 404 through eight polls after
      # its push, and 202609061149 only went live because an unrelated homepage
      # restore happened to fire this workflow. CD that depends on a coincidence
      # is not CD. The workflow file itself is listed too, so a change to what
      # deploys is deployed by the same push that makes it.
      - 'uk_renewables_pipeline/**'
      - 'pipelinenews_intelligence/**'
      # The homepage is rendered from catalogue/homepage-catalogue.json. A run of
      # scripts/build_homepage_catalogue.py that changes only the JSON must deploy.
      - 'catalogue/**'
      - '.github/workflows/deploy-pages.yml'
      - 'CNAME'
      # The build status page is published from the repository root, not from a
      # release directory, so nothing above matched it. status.json was committed
      # at 15,173 bytes with 25 entries on 2026-09-05 and that push triggered zero
      # workflow runs; the site kept serving the previous 10,454-byte, 19-entry
      # document. The page built specifically so a lost context window could
      # recover the estate's state was the one artefact that never reached it.
      # Checking for HTTP 200 did not catch this - the stale document also
      # returns 200. Compare published bytes, not status codes.
      - 'status.html'
      - 'status.json'
      # A published Pipeline News snapshot must trigger the deploy that
      # serves it. Until 202609020025 no path here matched
      # pipelinenews_intelligence/, so pushing a new release directory
      # deployed nothing at all: 202609012326 sat on origin/main, complete
      # and verified byte-identical to its release, and returned 404 for
      # over an hour. Every earlier snapshot appeared to work only because
      # its commit also touched index.html, which did match - so the
      # directory was being served as a side effect of a homepage edit
      # rather than because it had been published.
      - 'pipelinenews_intelligence/**'
      - 'employers_competence/**'
      - 'solar_deployment_statistics/**'
      - 'solar_components/**'
      - 'uk_renewables_pipeline/**'
      # The estate build scan is a published directory like the Pipeline News
      # snapshots above. Without a path here a rescan would deploy nothing,
      # and would appear to work only when its commit also touched index.html.
      - 'estate_scan/**'
      # Working papers are published directories like the snapshots above.
      # papers/202609060045-published-fault-level/ was the first; without a
      # path here it would have deployed only when a commit also touched
      # index.html, which is the silent non-deploy this list keeps recording.
      - 'papers/**'
      # Grid Engine workbenches are published directories like the papers and
      # snapshots above, plus a ledger the index reads at runtime. Without a
      # path here a new iteration would deploy nothing, and would appear to
      # work only when its commit also touched index.html — the silent
      # non-deploy this list exists to keep recording.
      - 'grid_engine/**'
      - 'dist/major_project_news_v5.json'
      - 'dist/major_projects_v5.json'
      - 'dist/major_project_news_v6.json'
      - 'dist/major_project_news_v9_5_1.json'
      - 'dist/major_projects_v6.json'
      - 'dist/project_identity_v6.json'
      - 'dist/project_identity_v6_integrity.json'
      - 'dist/project_news_links_v6.json'
      - 'dist/repd_source_reconciliation_v6.json'
      - 'dist/renewables_v6_integrity.json'
      - 'dist/manifest_v6.json'
      - 'dist/repd_master.json'
      - 'dist/manifest_v4.json'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      deployed_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Record deployed commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Mark Pages deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.source.outputs.sha }}
        run: |
          gh api --method POST \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=pending \
            -f context='globalgrid/pages-deploy' \
            -f description='GlobalGrid2050 Pages deployment running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Import hash-pinned homepage owner bundle
        run: python3 scripts/import_homepage_owner.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify_v9_7_candidate:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    timeout-minutes: 20
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.deployed_sha }}
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: uk_renewables_pipeline/v9.7/package-lock.json
      - name: Install pinned browser harness
        working-directory: uk_renewables_pipeline/v9.7
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Wait for deployed V9.7 candidate bytes
        env:
          TARGET_SHA: ${{ needs.build.outputs.deployed_sha }}
        run: |
          live="https://globalgrid2050.com/uk_renewables_pipeline/v9.7/?deployment=${TARGET_SHA}"
          for _ in {1..30}; do
            if curl --fail --silent --show-error --location --max-time 20 "$live" | grep -q 'UK RENEWABLES PIPELINE V9.7'; then
              exit 0
            fi
            sleep 2
          done
          echo "Deployed V9.7 candidate HTML did not become observable" >&2
          exit 1
      - name: Run deployed V9.7 candidate browser proof
        env:
          TARGET_SHA: ${{ needs.build.outputs.deployed_sha }}
          V9_BASE_URL: https://globalgrid2050.com/uk_renewables_pipeline/v9.7/?deployment=${{ needs.build.outputs.deployed_sha }}
        run: node uk_renewables_pipeline/v9.7/tests/browser_smoke_v9_7.mjs

      - name: Verify VENTUS wiring on Linux Chromium
        working-directory: uk_renewables_pipeline/v9.7
        env:
          TARGET_SHA: ${{ needs.build.outputs.deployed_sha }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const report=[];
          try {
            for(const [file,kind] of [['inverter-48.html','dc'],['inverter-station.html','ac']]) {
              const page=await browser.newPage({viewport:{width:1440,height:1000}}),errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              const start=Date.now();
              const response=await page.goto('https://globalgrid2050.com/ventus/wiring/'+file+'?release='+process.env.TARGET_SHA,{waitUntil:'domcontentloaded'});
              assert.equal(response.status(),200);
              await page.waitForFunction(k=>k==='dc'?window.__inverter48?.ready&&window.__inverter48.animatedHomeCount===48:!!window.__inverterStation,kind,{timeout:45000});
              const state=await page.evaluate(k=>k==='dc'?{modules:__inverter48.model.modules.length,homes:__inverter48.model.homes.length,playing:__inverter48.playing,activeHomes:__inverter48.animatedHomeCount}:{inverters:__inverterStation.model.inverters.length,cables:__inverterStation.model.cables.length,paused:document.querySelector('#drawing').classList.contains('paused')},kind);
              if(kind==='dc'){assert.equal(state.modules,900);assert.equal(state.homes,48);assert.equal(state.playing,true);assert.equal(state.activeHomes,48);}
              else{assert.equal(state.inverters,28);assert.equal(state.cables,84);assert.equal(state.paused,true);}
              assert.deepEqual(errors,[]);
              report.push({file,platform:process.platform,state,readyMs:Date.now()-start,errors});
              await page.close();
            }
            console.log(JSON.stringify({passed:true,release:process.env.TARGET_SHA,report},null,2));
          }finally{await browser.close();}
          JS

  report:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, deploy, verify_v9_7_candidate]
    steps:
      - name: Publish Pages deployment result
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.build.outputs.deployed_sha || github.sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify_v9_7_candidate.result }}
        run: |
          if [[ "$BUILD_RESULT" == "success" && "$DEPLOY_RESULT" == "success" && "$LIVE_RESULT" == "success" ]]; then
            state=success
            description='Pages deployment and V9.7 candidate browser proof passed'
          elif [[ "$BUILD_RESULT" == "cancelled" || "$DEPLOY_RESULT" == "cancelled" || "$LIVE_RESULT" == "cancelled" ]]; then
            state=error
            description='GlobalGrid2050 Pages verification cancelled'
          else
            state=failure
            description='Pages deployment or V9.7 candidate proof failed'
          fi
          gh api --method POST \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='globalgrid/pages-deploy' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
