name: fetch_uk_frequency_v5

on:
  workflow_dispatch:
    inputs:
      burst_samples:
        description: Number of 2 minute spaced samples to take in this run
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3', '6', '12']
      rolling_hours:
        description: Rolling retention window in hours
        required: true
        default: '24'
        type: choice
        options: ['6', '12', '24']
permissions:
  contents: write

concurrency:
  group: uk-frequency-v5
  cancel-in-progress: false

jobs:
  update-frequency:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      - name: Resolve frequency run settings
        id: settings
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "burst_samples=${{ github.event.inputs.burst_samples }}" >> "$GITHUB_OUTPUT"
            echo "rolling_hours=${{ github.event.inputs.rolling_hours }}" >> "$GITHUB_OUTPUT"
          else
            echo "burst_samples=1" >> "$GITHUB_OUTPUT"
            echo "rolling_hours=24" >> "$GITHUB_OUTPUT"
          fi

      - name: Run V5 UK grid frequency collector
        env:
          GG_FREQUENCY_BURST_SAMPLES: ${{ steps.settings.outputs.burst_samples }}
          GG_FREQUENCY_SLEEP_SECONDS: '120'
          GG_FREQUENCY_ROLLING_HOURS: ${{ steps.settings.outputs.rolling_hours }}
          GG_FREQUENCY_LOOKBACK_MINUTES: '180'
        run: python scripts/update_uk_frequency_v5.py

      - name: Commit V5 frequency feed and report
        env:
          PUSH_TOKEN: ${{ secrets.GRIDBOT_PAT || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"
          git add \
            uk_energy_tracking_v5/grid_frequency_history.csv \
            uk_energy_tracking_v5/live_grid_frequency.json \
            uk_energy_tracking_v5/grid_frequency_weekly_health.csv \
            uk_energy_tracking_v5/live_grid_frequency_weekly_health.json \
            gridbot_reports/uk_frequency_v5_report.md
          if git diff --cached --quiet; then
            echo "No staged V5 frequency changes to commit"
            git status --short
            exit 0
          fi
          git commit -m "Automated UK frequency update V5: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git main
          git push https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
