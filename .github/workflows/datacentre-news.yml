name: Data-centre capex and politics news (daily, data branch)
# Owner, 14 Nov 2026 00:56 UTC: "I want data centre CAPEX news and politics in the REPD pipeline. Simple."
# This is an owner-requested scheduled workflow (an exception to the 000_freeze manual-only rule, like the monthly
# REPD check). It reads a fixed list of public RSS/Atom feeds (automation/news/datacentre_feed.py, FEEDS), keeps
# headlines and links only, and publishes ONE file, datacentre_news.json, to the branch datacentre-news-data.
# It never pushes to main, never opens a PR, never deploys: the Pipeline News panel reads the file from
# raw.githubusercontent.com on that branch, so a daily refresh needs no Pages rebuild. A push made with
# GITHUB_TOKEN starts no other workflow. One feed failing is recorded in the file's "feeds" list and does not
# fail the job; the job fails only when every feed failed and there is no earlier file.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: datacentre-news
  cancel-in-progress: false
env:
  DATA_BRANCH: datacentre-news-data
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests (offline fixtures)
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q -p no:cacheprovider automation/news/tests/test_datacentre_feed.py
      - name: Bring in the previous file from the data branch (keeps older items)
        run: |
          mkdir -p dist
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            git show FETCH_HEAD:dist/datacentre_news.json > dist/datacentre_news.json || rm -f dist/datacentre_news.json
          fi
      - name: Fetch feeds and build dist/datacentre_news.json
        run: python automation/news/datacentre_feed.py --out dist/datacentre_news.json
      - name: Summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("dist/datacentre_news.json")
          if not p.exists():
              print("no output"); raise SystemExit
          d = json.loads(p.read_text())
          print(f"**{d['status']}**  {json.dumps(d['counts'])}\n")
          print("| feed | status | entries | kept | error |\n|---|---|---|---|---|")
          for f in d["feeds"]:
              print(f"| {f['url']} | {f['status']} | {f.get('entries','')} | {f.get('kept','')} | {f.get('error','')} |")
          print("\n| date | lanes | source | title |\n|---|---|---|---|")
          for i in d["items"][:15]:
              print(f"| {i['date']} | {'+'.join(i['lanes'])} | {i['source']} | {i['title']} |")
          EOF
      - name: Publish to the data branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pub="$RUNNER_TEMP/pub"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git worktree add --detach "$pub" FETCH_HEAD
          else
            git worktree add --detach "$pub" HEAD
            git -C "$pub" checkout --orphan datacentre-news-tmp
            git -C "$pub" rm -rq --cached .
            find "$pub" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p "$pub/dist"
          cp dist/datacentre_news.json "$pub/dist/datacentre_news.json"
          printf '%s\n' "Published daily by .github/workflows/datacentre-news.yml on main. Headlines and links only." \
            "Read by the Pipeline News panel scripts/plugins/datacentre-news.js. Do not edit by hand." > "$pub/README.txt"
          git -C "$pub" add dist/datacentre_news.json README.txt
          if git -C "$pub" diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          git -C "$pub" commit -q -m "data-centre news $(date -u +%Y-%m-%dT%H:%MZ)"
          git -C "$pub" push origin "HEAD:refs/heads/$DATA_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: datacentre-news
          path: dist/datacentre_news.json
          retention-days: 14
