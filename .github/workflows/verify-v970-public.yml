name: Verify V9.70 actual public MAP source, homepage and V9.69 rollback
on:
  push:
    branches: [main]
    paths:
      - 'catalogue/homepage-owner.json'
      - 'uk_renewables_pipeline/202611221900/**'
      - '.github/workflows/verify-v970-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  served:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compare live HTTPS bytes to owner-pinned homepage and immutable source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, time
          from urllib.request import Request, urlopen
          pin=json.loads(Path('catalogue/homepage-owner.json').read_text())
          assert pin['repository']=='Ventusltd/globalgrid2050-homepage'
          assert pin['commit']=='a97aa204164063a9af4b822c15133c2423cfbbce'
          def get(url):
              req=Request(url,headers={'Cache-Control':'no-cache','Accept-Encoding':'identity','User-Agent':'Ventus-V970-public-source-verifier'})
              with urlopen(req,timeout=25) as r:
                  if r.status!=200:raise ValueError('HTTP '+str(r.status)+' '+url)
                  return r.read(4_000_000)
          def sha(b):return hashlib.sha256(b).hexdigest()
          owner='https://raw.githubusercontent.com/'+pin['repository']+'/'+pin['commit']+'/'
          owner_html=get(owner+'index.html')
          owner_json=get(owner+'data/homepage.json')
          assert sha(owner_html)==pin['files']['index.html'], 'Owner HTML pin mismatch'
          assert sha(owner_json)==pin['files']['data/homepage.json'], 'Owner JSON pin mismatch'
          # Source publisher imports the owner page and rewrites two asset paths
          # and one catalogue link. Compare with the transformed bytes actually served.
          html=owner_html.decode('utf-8-sig')
          for file in ('versioned-homepage.css','versioned-homepage.js'):
              old='./assets/'+file
              assert html.count(old)==1
              html=html.replace(old,'./homepage-shell/assets/'+file)
          old='href="data/homepage.json"'
          assert html.count(old)==1
          html=html.replace(old,'href="./homepage-shell/data/homepage.json"')
          expected={'index.html':(html.rstrip()+'\n').encode('utf-8'),
                    'homepage-shell/data/homepage.json':owner_json}
          current='uk_renewables_pipeline/202611221900/'
          previous='uk_renewables_pipeline/202611221850/'
          for name in ('index.html','repd-expanded.mjs','styles/repd-expanded.css','map-entry.mjs'):
              expected[current+name]=Path(current+name).read_bytes()
          for name in ('index.html','repd-expanded.mjs','report-a4.mjs'):
              expected[previous+name]=Path(previous+name).read_bytes()
          assert b'202611221900' in expected['index.html'], 'Root must advertise V9.70'
          assert b'202611221900' in expected['homepage-shell/data/homepage.json'], 'Owner must pin V9.70'
          assert Path(current+'report-a4.mjs').read_bytes()==Path(previous+'report-a4.mjs').read_bytes(), 'A4 changed'
          for attempt in range(1,41):
              bad=[]
              for path,source in expected.items():
                  url='https://globalgrid2050.com/'+path+'?v970_verify='+str(attempt)+'-'+os.getenv('GITHUB_SHA','')[:8]
                  try:
                      public=get(url)
                      if sha(public)!=sha(source):bad.append(path+' SHA256 mismatch')
                  except Exception as exc:bad.append(path+': '+str(exc))
              if not bad:
                  print('PASS',len(expected),'served SHA256 comparisons; operative homepage V9.70, original MAP/A4, V9.69 rollback')
                  break
              if attempt==40:raise SystemExit('V9.70 not publicly verified: '+repr(bad))
              print(f'Attempt {attempt}/40: {len(bad)} pending: {bad[:3]}',flush=True)
              time.sleep(10)
          PY
