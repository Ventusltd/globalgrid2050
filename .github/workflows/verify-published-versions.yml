# Publishing a version and naming it are two separate acts here. Nothing checked
# the second one had happened, so 202609012326 and 202609020025 were served with
# HTTP 200 while the newest version a reader could reach was 202608312339.
#
# This workflow makes that state red instead of invisible. It changes nothing and
# deploys nothing: it reads the homepage and the published snapshot directories
# and fails when they disagree.
name: Verify published versions are reachable

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'pipelinenews_intelligence/**'
      - 'scripts/verify_published_versions.py'
      - 'scripts/test_verify_published_versions.py'
      - '.github/workflows/verify-published-versions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-published-versions
  cancel-in-progress: true

jobs:
  publication-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Test fail-closed publication rules
        run: python3 -m unittest scripts/test_verify_published_versions.py

      - name: Verify every published snapshot is reachable and the newest is current
        run: |
          mkdir -p reports
          python3 scripts/verify_published_versions.py --json reports/publication-truth.json

      - name: Retain the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-truth
          path: reports/publication-truth.json
          if-no-files-found: warn
