name: Generate GIS SLD Full Code Reports

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-gis-sld-full-code-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GRIDBOT_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate GIS SLD full code reports
        run: python scripts/generate_gis_sld_full_code_reports.py

      - name: Run GIS SLD full code report checks
        run: python scripts/test_generate_gis_sld_full_code_reports.py

      - name: Commit and push GIS SLD full code reports
        run: |
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"

          git pull --rebase --autostash origin main

          git add \
            solar-bess-topology-v7/gis-sld-financial-sandbox/GIS_SLD_FULL_CODE_REPORT_V7.md \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/GIS_SLD_FULL_CODE_REPORT_V8.md \
            scripts/generate_gis_sld_full_code_reports.py \
            scripts/test_generate_gis_sld_full_code_reports.py \
            gridbot_reports/generate_gis_sld_full_code_reports.md

          if git diff --cached --quiet; then
            echo "No GIS SLD full code report changes to commit."
            exit 0
          fi

          git commit -m "Generate GIS SLD full code reports"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
