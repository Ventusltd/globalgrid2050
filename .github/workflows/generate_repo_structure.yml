name: Generate Repo Structure Gridbot

on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: generate-repo-structure-gridbot
  cancel-in-progress: true

jobs:
  generate-tree:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tree utility
        run: sudo apt-get update && sudo apt-get install tree -y

      - name: Generate structure report
        run: |
          tree -I '.git|__pycache__|node_modules|.github|_site|.jekyll-cache|.sass-cache' > REPO_STRUCTURE.txt

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "Gridbot"
          git config --global user.email "gridbot@ventus.com"
          git add REPO_STRUCTURE.txt
          if git diff --cached --quiet; then
            echo "No REPO_STRUCTURE.txt changes to commit"
            exit 0
          fi
          git commit -m "docs: Automated repository structure update by Gridbot"
          git pull --rebase https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git main
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
