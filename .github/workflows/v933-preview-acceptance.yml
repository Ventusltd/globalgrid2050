# QA-REF-ONLY overlay of an existing manual workflow. Never merge this overlay.
name: PN3 exact public URL proof (nonrelease QA only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pn3-public-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-url-proof:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/qa/pn3-public-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PN_PUBLIC_ROOT: ${{ github.workspace }}
      PN_PUBLIC_EDITION: '202611180633'
      PN_PUBLIC_NEWS_CONTEXT: 'true'
      EXPECTED_PN_INDEX_SHA256: 'e1d5ce5eb05d248bfd7ec5616ee151377380be1127929e3214b806365022ae04'
      EXPECTED_ATLAS_GENERATION: '202611180026'
      PLAYWRIGHT_MODULE: ${{ github.workspace }}/automation/news/acquisition/browser/node_modules/playwright/index.mjs
      PN_SOURCE_PIN_MANIFEST: ${{ github.workspace }}/automation/pipeline_public/v946-source-pins.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Assert frozen source identity without repeating release matrices
        shell: bash
        run: |
          set -euo pipefail
          echo "PN_PUBLIC_OUT=$RUNNER_TEMP/pn3-public-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD:uk_renewables_pipeline/202611180633)" = '97611064f880544ea22b8bb01af2aef318b93001'
          node automation/journey_return_ui/20261118/verify-closure.mjs uk_renewables_pipeline/202611180633
          node automation/energy_context_ui/20261118/verify-closure.mjs uk_renewables_pipeline/202611180633
      - name: Python exact 39-pin public served-byte readback
        run: python -B automation/pipeline_public/readback-pins.py
      - name: Existing locked Playwright and both Linux browser engines
        run: |
          npm ci --prefix automation/news/acquisition/browser --ignore-scripts
          npm exec --prefix automation/news/acquisition/browser -- playwright install --with-deps chromium webkit
      - name: Actual dated PN3 to actual G193 taps, controls and return
        run: node automation/pipeline_public/journey-entry.mjs
      - name: Retain all receipts and screenshots including the first failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pn3-public-url-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PN_PUBLIC_OUT }}/
          retention-days: 14
          if-no-files-found: warn
