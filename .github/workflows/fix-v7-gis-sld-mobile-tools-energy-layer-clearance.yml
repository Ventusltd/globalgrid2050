name: Fix V7 GIS SLD Mobile Tools Energy Layer Clearance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-mobile-tools-clearance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GRIDBOT_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply mobile tools energy layer clearance fix
        run: python scripts/fix_v7_gis_sld_mobile_tools_energy_layer_clearance.py

      - name: Commit and push mobile tools energy layer clearance fix
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"

          git pull --rebase --autostash origin main
          git add \
            solar-bess-topology-v7/gis-sld-financial-sandbox/gis-sld-v5.css \
            scripts/fix_v7_gis_sld_mobile_tools_energy_layer_clearance.py \
            gridbot_reports/fix_v7_gis_sld_mobile_tools_energy_layer_clearance.md

          if git diff --cached --quiet; then
            echo "No mobile tools clearance changes to commit."
            exit 0
          fi

          git commit -m "Fix V7 GIS SLD mobile tools clearance"
          git pull --rebase --autostash origin main
          git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
