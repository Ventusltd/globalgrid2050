name: Add V8 BESS Geospatial Layout Drawing

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  add-v8-bess-geospatial-layout-drawing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GRIDBOT_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Add V8 BESS geospatial layout drawing
        run: python scripts/add_v8_bess_geospatial_layout_drawing.py

      - name: Run V8 BESS geospatial layout drawing checks
        run: python scripts/test_add_v8_bess_geospatial_layout_drawing.py

      - name: Commit and push V8 BESS geospatial layout drawing
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"

          git pull --rebase --autostash origin main

          git add \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/index.html \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/bess-gis-sld-financial-sandbox.css \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/bess-gis-sld-financial-sandbox.js \
            scripts/add_v8_bess_geospatial_layout_drawing.py \
            scripts/test_add_v8_bess_geospatial_layout_drawing.py \
            gridbot_reports/add_v8_bess_geospatial_layout_drawing.md

          if git diff --cached --quiet; then
            echo "No V8 BESS geospatial layout drawing changes to commit."
            exit 0
          fi

          git commit -m "Add V8 BESS geospatial layout drawing"
          git pull --rebase --autostash origin main
          git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
