name: Pipeline candidate source and interaction acceptance
on:
  pull_request:
    paths:
      - 'uk_renewables_pipeline/202611171141/**'
      - 'uk_renewables_pipeline/202611171217/**'
      - 'uk_renewables_pipeline/202611171507/**'
      - 'uk_renewables_pipeline/202611171526/**'
      - 'uk_renewables_pipeline/202611171550/**'
      - 'uk_renewables_pipeline/202611171609/**'
      - 'uk_renewables_pipeline/202611171710/**'
      - 'automation/v934_preview/**'
      - 'automation/v935_preview/**'
      - 'automation/v936_preview/**'
      - 'automation/v937_preview/**'
      - 'automation/v938_preview/**'
      - 'automation/v939_preview/**'
      - 'automation/v940_preview/**'
      - 'automation/ticker_neon_ui/**'
      - 'automation/document_facts_ui/**'
      - 'automation/news/filings/**'
      - 'automation/grid_notice_ui/**'
      - 'automation/news/grid_watch/**'
      - 'automation/news_quality_ui/**'
      - 'automation/repd_expand_ui/**'
      - '.github/workflows/v934-preview-acceptance.yml'
permissions:
  contents: read
jobs:
  date-controls:
    strategy:
      matrix:
        include:
          - edition: '202611171141'
            version: '9_34'
            suite: v934_preview
          - edition: '202611171217'
            version: '9_35'
            suite: v935_preview
          - edition: '202611171507'
            version: '9_36'
            suite: v936_preview
          - edition: '202611171526'
            version: '9_37'
            suite: v937_preview
          - edition: '202611171550'
            version: '9_38'
            suite: v938_preview
          - edition: '202611171609'
            version: '9_39'
            suite: v939_preview
          - edition: '202611171710'
            version: '9_40'
            suite: v940_preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Formal edition and unchanged canonical data
        run: bash uk_renewables_pipeline/${{ matrix.edition }}/tests/run_v${{ matrix.version }}.sh
      - name: Existing locked browser dependencies
        run: |
          npm ci --prefix automation/news/acquisition/browser --ignore-scripts
          npm exec --prefix automation/news/acquisition/browser -- playwright install --with-deps chromium
      - name: Ticker source guards, truthful counts and bounded browsing contracts
        if: matrix.suite == 'v936_preview'
        run: node --test automation/v936_preview/contracts.test.mjs
      - name: News health, original-document preservation and source-clock contracts
        if: matrix.suite == 'v937_preview'
        run: node --test automation/v937_preview/contracts.test.mjs
      - name: Source-qualified government notice, typed clocks and rights gates
        if: matrix.suite == 'v938_preview'
        run: |
          python -m unittest discover -s automation/news/tests -p test_grid_watch.py -v
          python -m unittest discover -s automation/news/tests -p test_grid_government_v938.py -v
          node --test automation/v938_preview/contracts.test.mjs
      - name: Exact document fact bytes, typed-source and refusal contracts
        if: matrix.suite == 'v939_preview'
        run: node --test automation/v939_preview/contracts.test.mjs
      - name: Moving ticker, source guards, shared pins and explicit migration contracts
        if: matrix.suite == 'v940_preview'
        run: |
          node --test automation/v940_preview/contracts.test.mjs
          python -m unittest discover -s automation/v940_preview -p 'test_migration*.py' -v
      - name: Date and news interaction on desktop and mobile
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/automation/news/acquisition/browser/node_modules/playwright/index.mjs
          V934_OUT: ${{ runner.temp }}/date-proof
          V935_OUT: ${{ runner.temp }}/date-proof
          V936_OUT: ${{ runner.temp }}/date-proof
          V937_OUT: ${{ runner.temp }}/date-proof
          V938_OUT: ${{ runner.temp }}/date-proof
          V939_OUT: ${{ runner.temp }}/date-proof
          V940_OUT: ${{ runner.temp }}/date-proof
        run: node automation/${{ matrix.suite }}/browser.mjs
      - name: Expanded analytics, close, focus, scroll and rotation
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/automation/news/acquisition/browser/node_modules/playwright/index.mjs
          REPD_EXPAND_EDITION: uk_renewables_pipeline/${{ matrix.edition }}
          REPD_EXPAND_OUT: ${{ runner.temp }}/date-proof/expand
        run: node automation/repd_expand_ui/browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: date-controls-proof-${{ matrix.edition }}
          path: ${{ runner.temp }}/date-proof
          retention-days: 14
