name: Step 2 Build PVLive Solar Browser V6

on:
  workflow_dispatch:
    inputs:
      max_bytes:
        description: Maximum browser solar JSON size in bytes
        required: false
        default: '500000'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build PVLive solar browser file
        run: python scripts/build_pvlive_solar_browser_v6.py --max-bytes "${{ github.event.inputs.max_bytes }}"
      - name: Commit PVLive browser file and audit
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          set -e
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"
          git add uk_energy_tracking_v6/generation_history/pvlive_solar_daily_browser.json
          git add uk_energy_tracking_v6/generation_history/manifests/pvlive_solar_daily_browser.manifest.json
          git add data_science_protocol/audit_reports/PVLIVE_SOLAR_BROWSER_LATEST.md
          git add data_science_protocol/audit_reports/json/PVLIVE_SOLAR_BROWSER_LATEST.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "gridbot: build PVLive solar browser file"
            git pull --rebase https://${PAT}@github.com/${{ github.repository }}.git main
            git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
          else
            echo "No PVLive solar browser changes to commit"
          fi
