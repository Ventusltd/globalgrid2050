name: GridBot Generation MWh Interconnector Split V6

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
      max_output_mb:
        description: Maximum generated interconnector JSON size in MB
        required: true
        default: '25'
      commit_reports:
        description: Commit reports and audited outputs
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

concurrency:
  group: gridbot-generation-mwh-interconnector-split-v6
  cancel-in-progress: false

jobs:
  generation-mwh-interconnector-split-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository using GridBot PAT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT }}

      - name: Sync latest main before processing
        run: git pull --ff-only origin main

      - name: Run audit
        if: ${{ github.event.inputs.mode == 'audit' }}
        run: |
          python scripts/gridbot_generation_mwh_interconnector_split_v6.py \
            --max-output-mb "${{ github.event.inputs.max_output_mb }}"

      - name: Run apply
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: |
          python scripts/gridbot_generation_mwh_interconnector_split_v6.py \
            --max-output-mb "${{ github.event.inputs.max_output_mb }}" \
            --apply

      - name: Upload interconnector split report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-mwh-interconnector-split-v6-${{ github.event.inputs.mode }}
          path: |
            data_science_protocol/audit_reports/GENERATION_MWH_INTERCONNECTOR_SPLIT_V6_LATEST.md
            data_science_protocol/audit_reports/json/GENERATION_MWH_INTERCONNECTOR_SPLIT_V6_LATEST.json

      - name: Commit audit report only
        if: ${{ github.event.inputs.commit_reports == 'true' && github.event.inputs.mode == 'audit' }}
        run: |
          git config user.name "Gridbot"
          git config user.email "gridbot@users.noreply.github.com"
          git add scripts/gridbot_generation_mwh_interconnector_split_v6.py
          git add .github/workflows/gridbot_generation_mwh_interconnector_split_v6.yml
          git add data_science_protocol/audit_reports/GENERATION_MWH_INTERCONNECTOR_SPLIT_V6_LATEST.md
          git add data_science_protocol/audit_reports/json/GENERATION_MWH_INTERCONNECTOR_SPLIT_V6_LATEST.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "gridbot: generation mwh interconnector split v6 audit"
            git push origin HEAD:main
          fi

      - name: Commit audited UI/data output and report
        if: ${{ github.event.inputs.commit_reports == 'true' && github.event.inputs.mode == 'apply' }}
        run: |
          git config user.name "Gridbot"
          git config user.email "gridbot@users.noreply.github.com"
          git add scripts/gridbot_generation_mwh_interconnector_split_v6.py
          git add .github/workflows/gridbot_generation_mwh_interconnector_split_v6.yml
          git add uk_energy_tracking_v6/generation_history/index.md
          git add uk_energy_tracking_v6/generation_history/load_generation_mwh_aggregates.js
          git add uk_energy_tracking_v6/generation_history/render_generation_mwh_aggregates.js
          git add uk_energy_tracking_v6/generation_history/control_generation_mwh_aggregates.js
          git add uk_energy_tracking_v6/generation_history/generation_interconnector_annual_mwh_by_link_direction.json
          git add data_science_protocol/audit_reports/GENERATION_MWH_INTERCONNECTOR_SPLIT_V6_LATEST.md
          git add data_science_protocol/audit_reports/json/GENERATION_MWH_INTERCONNECTOR_SPLIT_V6_LATEST.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "gridbot: generation mwh interconnector split v6 apply"
            git push origin HEAD:main
          fi
