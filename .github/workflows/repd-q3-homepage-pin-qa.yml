name: Q3 homepage owner pin acceptance (read-only)

on:
  pull_request:
    branches: [main]
    paths:
      - catalogue/homepage-owner.json
      - .github/workflows/repd-q3-homepage-pin-qa.yml
  push:
    branches:
      - release/pipeline-news-homepage-pin-20261114
    paths:
      - catalogue/homepage-owner.json
      - .github/workflows/repd-q3-homepage-pin-qa.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            catalogue
            scripts
            homepage-shell
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch all seven pinned owner files and regenerate local homepage
        run: python3 scripts/import_homepage_owner.py
      - name: Assert Q3 operative, old rollback and exact owner commit
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          pin=json.loads(Path("catalogue/homepage-owner.json").read_text())
          assert pin["commit"]=="cdd5e1f295043ea6e69077854204d7e34071a64a"
          doc=json.loads(Path("homepage-shell/data/homepage.json").read_text())
          entity=next(x for x in doc["entities"] if x["id"]=="pipeline-news")
          assert entity["operative_release_id"]=="202611132345"
          assert {r["id"] for r in entity["releases"]} >= {"202611132345","202609082224"}
          assert doc["promotions"][-1]["to_release_id"]=="202611132345"
          index=Path("index.html").read_text()
          assert 'href="https://globalgrid2050.com/uk_renewables_pipeline/202611132345/"' in index
          for name in pin["files"]:
            local=Path("index.html") if name=="index.html" else Path("homepage-shell")/name
            if name=="index.html":
              continue # transformed on import, original hash verified by importer
            assert hashlib.sha256(local.read_bytes()).hexdigest()==pin["files"][name],name
          print("PASS: seven owner pins, Q3 homepage, September rollback, promotion audit")
          PY
