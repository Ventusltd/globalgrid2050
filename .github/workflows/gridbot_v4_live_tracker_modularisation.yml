name: GridBot V4 live tracker modularisation

on:
  workflow_dispatch:
    inputs:
      feature:
        description: V4 modularisation feature to run
        required: true
        default: live_tracker
        type: choice
        options: [live_tracker]

permissions:
  contents: write

concurrency:
  group: gridbot-v4-live-tracker-modularisation
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read V3 benchmark diary first
        run: |
          test -f uk_energy_tracking_v3/WORK_DIARY.md
          head -n 120 uk_energy_tracking_v3/WORK_DIARY.md

      - name: Read V4 work diary first
        run: |
          test -f uk_energy_tracking_v4/WORK_DIARY.md
          head -n 160 uk_energy_tracking_v4/WORK_DIARY.md

      - name: Run V4 live tracker modularisation
        run: python scripts/modularise_uk_energy_tracking_v4.py

      - name: Validate V4 scope
        run: |
          git diff --name-only > changed_files.txt
          if grep -v -E '^(uk_energy_tracking_v4/index.md|uk_energy_tracking_v4/live-tracker.js|uk_energy_tracking_v4/WORK_DIARY.md|gridbot_reports/v4_live_tracker_script_modularisation.md)$' changed_files.txt; then
            echo "Unexpected files changed"
            cat changed_files.txt
            exit 1
          fi

      - name: Validate protected trackers untouched
        run: |
          if git diff --name-only -- uk_energy_tracking_v3 uk_energy_tracking | grep .; then
            echo "Protected tracker changed"
            git diff --name-only -- uk_energy_tracking_v3 uk_energy_tracking
            exit 1
          fi

      - name: Commit and push V4 modularisation
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          set -e
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"
          git add uk_energy_tracking_v4/index.md uk_energy_tracking_v4/live-tracker.js uk_energy_tracking_v4/WORK_DIARY.md gridbot_reports/v4_live_tracker_script_modularisation.md
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "GridBot modularise V4 live tracker script"
            for attempt in 1 2 3 4 5; do
              git pull --rebase https://${PAT}@github.com/${{ github.repository }}.git main && git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main && exit 0
              echo "Push attempt ${attempt} failed"
              sleep 5
            done
            exit 1
          else
            echo "No V4 modularisation changes to commit"
          fi
