name: Replace V7 GIS SLD Asset Buttons With Pipeline Dropdown Status

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-asset-buttons-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GRIDBOT_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply status aware asset pipeline dropdown patch
        run: python scripts/replace_v7_gis_sld_asset_buttons_with_pipeline_dropdown_status.py

      - name: Run static checks
        run: python scripts/test_v7_gis_sld_asset_pipeline_dropdown_status.py

      - name: Commit and push status aware asset pipeline dropdown update
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"

          git pull --rebase --autostash origin main
          git add \
            solar-bess-topology-v7/gis-sld-financial-sandbox/index.html \
            solar-bess-topology-v7/gis-sld-financial-sandbox/gis-sld-v5-map.js \
            solar-bess-topology-v7/gis-sld-financial-sandbox/gis-sld-v5-ui.js \
            solar-bess-topology-v7/gis-sld-financial-sandbox/gis-sld-v5.css \
            scripts/replace_v7_gis_sld_asset_buttons_with_pipeline_dropdown_status.py \
            scripts/test_v7_gis_sld_asset_pipeline_dropdown_status.py \
            gridbot_reports/replace_v7_gis_sld_asset_buttons_with_pipeline_dropdown_status.md

          if git diff --cached --quiet; then
            echo "No status aware asset dropdown changes to commit."
            exit 0
          fi

          git commit -m "Add V7 GIS SLD asset status dropdown filters"
          git pull --rebase --autostash origin main
          git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
