name: Fix V7 GIS SLD Mobile MWp Sizing Visibility

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  fix-mobile-mwp-sizing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GRIDBOT_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply mobile MWp sizing visibility fix
        run: python scripts/fix_v7_gis_sld_mobile_mwp_sizing_visibility.py

      - name: Commit and push mobile MWp sizing visibility fix
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"

          git pull --rebase --autostash origin main
          git add \
            solar-bess-topology-v7/gis-sld-financial-sandbox/gis-sld-v5.css \
            scripts/fix_v7_gis_sld_mobile_mwp_sizing_visibility.py \
            gridbot_reports/fix_v7_gis_sld_mobile_mwp_sizing_visibility.md

          if git diff --cached --quiet; then
            echo "No mobile MWp sizing visibility changes to commit."
            exit 0
          fi

          git commit -m "Fix V7 GIS SLD mobile MWp sizing visibility"
          git pull --rebase --autostash origin main
          git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
