name: Patch V3 merged price source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_v3_price_history_merge_system.py
      - run: |
          git config user.name "GridBot"
          git config user.email "gridbot@globalgrid2050.com"
          git add uk_energy_tracking_v3/price-history-ui.js uk_energy_tracking_v3/WORK_DIARY.md
          git diff --cached --quiet || git commit -m "Patch V3 merged price source"
          git push
