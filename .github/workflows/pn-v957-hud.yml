name: Pipeline News V9.57 HUD browser acceptance
on:
  pull_request:
    paths:
      - 'uk_renewables_pipeline/202611201709/**'
      - '.github/workflows/pn-v957-hud.yml'
  push:
    branches: [main]
    paths:
      - 'uk_renewables_pipeline/202611201709/**'
      - '.github/workflows/pn-v957-hud.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser harness
        working-directory: uk_renewables_pipeline/202611201709
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Prove unchanged data and MAP source
        run: |
          for path in data news solar1000 map-entry.mjs; do
            test "$(git rev-parse HEAD:uk_renewables_pipeline/202611191418/$path)" = "$(git rev-parse HEAD:uk_renewables_pipeline/202611201709/$path)"
          done
      - name: Python immutable release delta gate
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          def tree(release):
              out = subprocess.check_output(['git','ls-tree','-r','-z','HEAD:uk_renewables_pipeline/'+release])
              return {p.decode(): m.split()[2].decode() for m,p in (entry.split(b'\t',1) for entry in out.split(b'\0') if entry)}
          old,new=tree('202611191418'),tree('202611201709')
          changes={p for p in old.keys() | new.keys() if old.get(p)!=new.get(p)}
          expected={'CHANGES.md','README.md','index.html','scripts/plugins/solar1000-v924.js','tests/hud-v955.mjs','tests/repd-summary-regression.mjs'}
          assert changes==expected,(changes,expected)
          assert new['scripts/plugins/solar1000-v924.js']=='dae14d6e557ab237173736053e505f0b4aabf478'
          print(f'PASS: {len(new)} tracked files; {len(changes)} expected changes; exact tested source blob')
          PY
      - name: Headless real gauges, ticker and register at fourteen engine/viewport combinations
        run: |
          python3 -m http.server 8765 >/tmp/pn-hud-http.log 2>&1 &
          node uk_renewables_pipeline/202611201709/tests/hud-v955.mjs
      - name: Prove Chart.js artifact integrity
        run: |
          printf '%s  %s\n' "$(openssl dgst -sha384 -binary uk_renewables_pipeline/202611201709/vendor/chart.umd.min.js | openssl base64 -A)" 'uk_renewables_pipeline/202611201709/vendor/chart.umd.min.js'
          test "$(openssl dgst -sha384 -binary uk_renewables_pipeline/202611201709/vendor/chart.umd.min.js | openssl base64 -A)" = 'jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ'
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pn-v957-hud-browser-evidence
          path: /tmp/pn-hud/
  served:
    if: github.event_name == 'push'
    needs: hud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Python independent public-byte readback
        run: |
          python3 - <<'PY'
          import hashlib, time, urllib.request
          from pathlib import Path
          release='202611201709'
          root=Path('uk_renewables_pipeline')/release
          paths=['index.html','scripts/plugins/solar1000-v924.js']
          deadline=time.monotonic()+720
          while True:
              try:
                  for path in paths:
                      url=f'https://globalgrid2050.com/uk_renewables_pipeline/{release}/{path}?verify={time.time_ns()}'
                      with urllib.request.urlopen(url,timeout=15) as response:
                          assert response.status==200
                          actual=response.read()
                      expected=(root/path).read_bytes()
                      assert actual==expected, f'Byte mismatch: {path}'
                      print(path, hashlib.sha256(actual).hexdigest(),flush=True)
                  print('PASS: public release bytes match GitHub source',flush=True)
                  break
              except Exception as exc:
                  if time.monotonic()>=deadline: raise
                  print(f'Public readback pending: {exc}',flush=True)
                  time.sleep(20)
          PY
