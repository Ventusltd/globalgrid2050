name: Q3 homepage owner pin acceptance (read-only)

on:
  pull_request:
    branches: [main]
    paths:
      - catalogue/homepage-owner.json
      - .github/workflows/repd-q3-homepage-pin-qa.yml
  push:
    branches:
      - release/pipeline-news-homepage-pin-20261114
    paths:
      - catalogue/homepage-owner.json
      - .github/workflows/repd-q3-homepage-pin-qa.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            catalogue
            scripts
            homepage-shell
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch all seven pinned owner files and regenerate local homepage
        run: python3 scripts/import_homepage_owner.py
      - name: Assert pinned owner integrity, Q3 operative and September rollback
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          pin=json.loads(Path("catalogue/homepage-owner.json").read_text())
          # Importer verifies all seven exact SHA256s against the pinned owner
          # commit; an old fixed commit here would reject every valid successor.
          import re
          assert re.fullmatch(r"[0-9a-f]{40}",pin["commit"])
          assert pin["repository"]=="Ventusltd/globalgrid2050-homepage"
          doc=json.loads(Path("homepage-shell/data/homepage.json").read_text())
          entity=next(x for x in doc["entities"] if x["id"]=="pipeline-news")
          # The operative release may move on from the first October edition
          # (202611132345); that edition and September must stay retained.
          operative=entity["operative_release_id"]
          release_ids={r["id"] for r in entity["releases"]}
          assert re.fullmatch(r"[0-9]{12}",operative) and operative in release_ids
          assert operative>="202611132345"
          assert release_ids >= {"202611132345","202609082224"}
          # The October promotion must be unique and remain the latest
          # Pipeline News promotion, not necessarily the last *site* promotion.
          pipeline_promotions=[p for p in doc["promotions"] if p["entity_id"]=="pipeline-news"]
          q3_promotions=[p for p in pipeline_promotions if p["to_release_id"]=="202611132345"]
          assert len(q3_promotions)==1
          assert q3_promotions[0]["from_release_id"]=="202609082224"
          # Later Pipeline News promotions must form an unbroken chain from the
          # October promotion to the operative release, each step recorded.
          start=pipeline_promotions.index(q3_promotions[0])
          chain=pipeline_promotions[start:]
          for prev,nxt in zip(chain,chain[1:]):
            assert nxt["from_release_id"]==prev["to_release_id"]
          assert chain[-1]["to_release_id"]==operative
          index=Path("index.html").read_text()
          assert f'href="https://globalgrid2050.com/uk_renewables_pipeline/{operative}/"' in index
          for name in pin["files"]:
            local=Path("index.html") if name=="index.html" else Path("homepage-shell")/name
            if name=="index.html":
              continue # transformed on import, original hash verified by importer
            assert hashlib.sha256(local.read_bytes()).hexdigest()==pin["files"][name],name
          print(f"PASS: seven owner pins, operative {operative}, October and September retained, promotion chain")
          PY
