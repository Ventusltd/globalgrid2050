name: Public language gate

# Register entry 24: the rule that certain words must not appear in public text
# was enforced by reading, and reading does not enforce. On 20 September 2026
# the published manual carried twenty reserved words, every one inside a
# disclaimer written to protect the reader. Intent is not the test.
#
# SHELL NOTE, learned the hard way at 00:30 on 21 September: this runs on the
# MSI runners, where bash.exe is NOT on the machine PATH and pwsh is not
# installed. A step with `shell: bash` does not fail loudly - the step is
# skipped with "bash: command not found" and the gate silently checks nothing.
# Every step here uses `shell: powershell` (5.1). Do not change that without
# checking the runner PATH first.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'status.html'
      - 'historical_builds.html'
      - 'compute/**'
      - 'kuiper-grid/**'
      - 'scripts/check_public_language.py'
      - '.github/workflows/public-language-gate.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # hourly, so a page that drifts is caught even without a push
    - cron: '35 * * * *'

permissions:
  contents: read

concurrency:
  group: public-language-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: [self-hosted, msi]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python must be present
        shell: powershell
        run: |
          $py = Get-Command python -ErrorAction SilentlyContinue
          if (-not $py) {
            Write-Host "FAIL: python is not on this runner's PATH."
            Write-Host "A check that cannot run is not a pass."
            exit 1
          }
          Write-Host ("python: " + $py.Source)
          python --version

      - name: Show the published surface
        shell: powershell
        run: python scripts/check_public_language.py --list

      - name: Gate
        shell: powershell
        run: python scripts/check_public_language.py

      - name: What a failure means
        if: failure()
        shell: powershell
        run: |
          Write-Host "This page must not be published as it stands."
          Write-Host "Either the wording changes, or the rule does - deliberately,"
          Write-Host "in scripts/check_public_language.py, with a reason."
