name: update-uk-fuel-prices

on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: update-uk-fuel-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Update UK fuel prices
        run: python scripts/update_uk_fuel_prices.py

      - name: Commit and push fuel updates
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          set -e
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"
          git add uk_energy_tracking/live_uk_fuel_prices.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Automated UK fuel price update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
          else
            echo "No changes to commit"
          fi
