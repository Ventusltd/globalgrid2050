name: Agent 3 Pipeline News P2 independent acceptance (HOLD-only)

# Independent, read-only acceptance engineering. This is a candidate preflight,
# NOT an auto-promoter. No secrets, write token, data push, merge or deployment.
on:
  pull_request:
    paths:
      - 'automation/pipeline_release/agent3_readonly_gate.py'
      - 'automation/pipeline_release/test_agent3_readonly_gate.py'
      - 'docs/news/AGENT3-P2-RELEASE-ACCEPTANCE.md'
      - '.github/workflows/agent3-p2-release-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run independently owned synthetic good and adversarial bad fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/pipeline_release/test_agent3_readonly_gate.py -v 2>&1 | tee agent3-p2-negative.log
      - name: Upload actual negative test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent3-p2-adversarial-fixtures
          path: agent3-p2-negative.log
          if-no-files-found: error
          retention-days: 90

  pinned-original-and-history:
    needs: negative-fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate QA head and complete historical trees
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: globalgrid
          persist-credentials: false
          fetch-depth: 0
      - name: Independently fetch original DESNZ Q3 CSV/XLSX from fixed historic Git SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Ventusltd/globalgrid2050
          ref: 213d1a79e876d80775f1be50caec94a8c449e09b
          path: official
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /evidence/repd-2026-q3/official-sources/REPD_Publication_Q3_2026.csv
            /evidence/repd-2026-q3/official-sources/REPD_Publication_Q3_2026.xlsx
      - name: Fetch independently reviewed TestCode verifier at fixed Agent 3 commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Ventusltd/testcode
          ref: dffac137cef300b734e9830e44e3cf11b9acb728
          path: independent-testcode
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /drivers/agent3-release-integrity-v1.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Check immutable original October 2026 bytes against hard-coded independent SHA256
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '48e76c49f33a1090e78108d1ea9bfe689b35963ea3be1bb4f6516d038a5ff862' \
            'official/evidence/repd-2026-q3/official-sources/REPD_Publication_Q3_2026.csv' \
            '87811e249395a05b223db6855952334f425e66cc9a2106caea0e38fd9e5037ea' \
            'official/evidence/repd-2026-q3/official-sources/REPD_Publication_Q3_2026.xlsx' \
            | sha256sum --strict --check | tee source-hashes.log
      - name: Verify original official Ref IDs and published tree hashes
        shell: bash
        run: |
          set -euo pipefail
          git -C globalgrid rev-parse HEAD | tee qa-head.txt
          git -C official rev-parse HEAD | tee official-head.txt
          node independent-testcode/drivers/agent3-release-integrity-v1.mjs \
            --source-csv official/evidence/repd-2026-q3/official-sources/REPD_Publication_Q3_2026.csv \
            --source-xlsx official/evidence/repd-2026-q3/official-sources/REPD_Publication_Q3_2026.xlsx \
            --release-repo globalgrid \
            --versions globalgrid/uk_renewables_pipeline/versions.json \
            --out independent-source-history.json
          jq -e '.offline_status == "PASS" and .publication_status == "HOLD" and .acceptance.release_authorised == false' independent-source-history.json
      - name: Read-only baseline release acceptance checklist (never authorises deployment)
        shell: bash
        run: |
          set -euo pipefail
          python3 globalgrid/automation/pipeline_release/agent3_readonly_gate.py \
            --repo globalgrid --out agent3-baseline.json
          jq -e '.offline_integrity_status == "PASS" and .acceptance_status == "UNVERIFIED" and .publication_status == "HOLD" and .release_authorised == false' agent3-baseline.json
      - name: Archive exact source, SHA and history checks with no silent missing outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent3-p2-pinned-source-history-HOLD
          path: |
            agent3-baseline.json
            independent-source-history.json
            source-hashes.log
            official-head.txt
            qa-head.txt
          if-no-files-found: error
          retention-days: 90
