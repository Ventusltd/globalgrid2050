<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>202609190700-universe</title>
<style>
  :root{--ink:#e8e6e1;--dim:#8b919c;--line:#171a20}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:var(--ink);
    font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
  #top{position:fixed;top:0;left:0;right:0;padding:8px 12px;display:flex;gap:16px;
    align-items:baseline;flex-wrap:wrap;pointer-events:none;z-index:10}
  #name{letter-spacing:.06em}
  #count{color:var(--dim)}
  #hud{position:fixed;top:8px;right:12px;color:var(--dim);z-index:10;text-align:right}
  #foot{position:fixed;left:0;right:0;bottom:0;padding:8px 12px;color:var(--dim);
    border-top:1px solid var(--line);background:#000c;z-index:10;line-height:1.7}
  b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><span id="name">THE UNIVERSE</span><span id="count">everything git logged</span></div>
<div id="hud">starting</div>
<div id="foot">
  drag to steer &middot; scroll to zoom &middot; every particle is one line git has ever recorded &middot;
  positions are computed from the ordinal, never stored &middot; provided as is, without warranty of any
  kind; a chart, not a design
</div>
<script type="module">
// THE UNIVERSE IS EVERYTHING GIT LOGGED.
//
// 124,905,502 lines, measured 2026-09-19 by twelve self-hosted runners over every blob in git
// history, sharded deterministically by content SHA, all twelve shards present.
//
// There is NO BUFFER. A buffer of 124.9 million positions would be a gigabyte and no browser
// would accept it. Each particle's position is computed in the vertex shader from gl_VertexID
// by the estate's own placement law, so the whole universe is drawn from a single integer and
// nothing is stored. This is the second law: positions are computed, never stored.
//
// Distance is time, as in the night sky: the further out, the further into the past.
const N = 124905502;          // measured, not assumed. See MEASURED.md in Ventusltd/kuiper-belt.
const GOLDEN = 2.399963229728653;

const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
const hud = document.getElementById('hud');
const fmt = n => n.toLocaleString('en-GB');

if (!gl) {
  hud.textContent = 'WebGL2 is not available here. Refusing rather than drawing a fraction.';
  throw new Error('no webgl2');
}

const VS = `#version 300 es
precision highp float;
uniform float u_n;        // the whole population
uniform float u_scale;    // zoom
uniform vec2  u_pan;
uniform float u_aspect;
out float v_r;
void main() {
  float k = float(gl_VertexID);
  // the estate's placement law, unchanged: r from the ordinal, theta by the golden angle.
  // sqrt gives uniform areal density, so the disc fills evenly rather than crowding the centre.
  float r = sqrt((k + 0.5) / u_n);
  float a = k * ${GOLDEN};
  vec2 p = vec2(cos(a), sin(a)) * r;
  v_r = r;
  p = p * u_scale + u_pan;
  p.x /= u_aspect;
  gl_Position = vec4(p, 0.0, 1.0);
  gl_PointSize = 1.0;
}`;

const FS = `#version 300 es
precision highp float;
in float v_r;
out vec4 o;
void main() {
  // base dust. brightness falls very slightly outward so depth reads, nothing else is encoded.
  float a = 0.16 + 0.10 * (1.0 - v_r);
  o = vec4(0.91, 0.90, 0.88, a);
}`;

function sh(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
gl.bindVertexArray(gl.createVertexArray());   // no attributes, no buffer, nothing uploaded

const uN = gl.getUniformLocation(prog, 'u_n');
const uS = gl.getUniformLocation(prog, 'u_scale');
const uP = gl.getUniformLocation(prog, 'u_pan');
const uA = gl.getUniformLocation(prog, 'u_aspect');

gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE);           // additive: density becomes brightness

let scale = 0.92, pan = [0, 0], drawn = 0, ms = 0;

// A single draw call of 124.9 million is refused by some drivers, so the SAME complete
// population is drawn in passes. Paging is honest: the set is unchanged. Sampling would not be.
const CHUNK = 8000000;

function resize() {
  const d = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.floor(innerWidth * d);
  cv.height = Math.floor(innerHeight * d);
  gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener('resize', resize); resize();

function frame() {
  const t0 = performance.now();
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(uN, N);
  gl.uniform1f(uS, scale);
  gl.uniform2f(uP, pan[0], pan[1]);
  gl.uniform1f(uA, cv.width / cv.height);
  drawn = 0;
  for (let first = 0; first < N; first += CHUNK) {
    const n = Math.min(CHUNK, N - first);
    gl.drawArrays(gl.POINTS, first, n);       // every particle, in passes, none skipped
    drawn += n;
  }
  ms = performance.now() - t0;
  hud.textContent = 'showing ' + fmt(drawn) + ' of ' + fmt(N) + ' lines · universe · '
    + ms.toFixed(0) + ' ms';
  if (drawn !== N) hud.textContent += ' · INCOMPLETE';
  requestAnimationFrame(frame);
}

document.getElementById('count').textContent =
  fmt(N) + ' lines git has recorded · 66 repositories · 42,549 blobs · 9,396,220,285 bytes';

let drag = null;
cv.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', e => {
  if (!drag) return;
  pan[0] += (e.clientX - drag[0]) / innerWidth * 2;
  pan[1] -= (e.clientY - drag[1]) / innerHeight * 2;
  drag = [e.clientX, e.clientY];
});
addEventListener('wheel', e => {
  scale *= e.deltaY < 0 ? 1.12 : 1 / 1.12;
  scale = Math.max(0.05, Math.min(4000, scale));
}, { passive: true });

requestAnimationFrame(frame);
</script>
</body>
</html>
