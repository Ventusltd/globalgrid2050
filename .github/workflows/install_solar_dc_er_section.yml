name: Install Solar DC ER Section

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target markdown file
        required: true
        default: employers_requirments_large_scale_solar/index.md
      fragment:
        description: Staged DC section fragment
        required: true
        default: content_fragments/employers_requirements_large_scale_solar/dc_string_and_dc_cable_system_requirements_v1.md
      contents:
        description: Replacement contents list
        required: true
        default: content_fragments/employers_requirements_large_scale_solar/contents_with_dc_section_v1.md
      marker:
        description: Insert before this existing heading
        required: true
        default: '# 5. Behaviour of Direct Current Systems'
permissions:
  contents: write

jobs:
  install-solar-dc-er-section:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GRIDBOT_PAT }}

      - name: Run installer
        shell: bash
        run: |
          python scripts/gridbot_insert_markdown_section.py \
            --target "${{ github.event.inputs.target }}" \
            --fragment "${{ github.event.inputs.fragment }}" \
            --new-contents "${{ github.event.inputs.contents }}" \
            --marker "${{ github.event.inputs.marker }}" \
            --backup-dir "backups/employers_requirments_large_scale_solar" \
            --report-dir "gridbot_reports"

      - name: Commit and push changes
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Install solar DC employer requirements section"
            git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
          else
            echo "No changes to commit"
          fi
