name: V6 Guardrail Preflight

on:
  pull_request:
    paths:
      - 'uk_energy_tracking_v6/**'
      - 'scripts/repair_v6_*.py'
      - '.github/workflows/repair_v6_*.yml'
      - 'scripts/v6_guardrail_preflight.py'
      - '.github/workflows/v6_guardrail_preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set comparison refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "BASE_SHA=$(git rev-parse HEAD~1)" >> "$GITHUB_ENV"
            echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Run V6 guardrail preflight
        run: python scripts/v6_guardrail_preflight.py
