name: Solar project evidence (weekly, review gated)
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'automation/news/**'
      - 'automation/pipeline_release/**'
      - 'uk_renewables_pipeline/202611161630/**'
      - '.github/workflows/pipeline-project-evidence-weekly.yml'
permissions:
  contents: read
concurrency:
  group: v9.25-evidence-${{ github.event_name == 'pull_request' && github.ref || 'weekly' }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  DATA_BRANCH: pipeline-evidence-data
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r automation/news/acquisition/requirements.txt
      - name: Validate frozen selection and source registry
        run: |
          python -m automation.news.acquisition.research_queue
          python -c "from automation.news.acquisition.fetch import load_sources; print(load_sources(include_disabled=True))"
      - name: Pytest including inherited news contracts
        run: python -m pytest -q automation/news/tests
      - name: Candidate release, unchanged register and MAP contracts
        run: bash uk_renewables_pipeline/202611161630/tests/run_v9_25.sh
      - name: Playwright desktop, tablet, mobile and negative states
        run: |
          npm ci --prefix automation/news/acquisition/browser
          npm exec --prefix automation/news/acquisition/browser -- playwright install --with-deps chromium
          npm test --prefix automation/news/acquisition/browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-candidate-tests
          path: |
            automation/news/acquisition/browser/test-results/
            uk_renewables_pipeline/202611161630/
          retention-days: 7
  probe:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r automation/news/acquisition/requirements.txt
      - name: Live source health only (no publication or research-negative rows)
        run: python -m automation.news.acquisition.run --probe --report "${{ runner.temp }}/source-probe.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-source-probe
          path: ${{ runner.temp }}/source-probe.json
          retention-days: 14
  refresh:
    needs: [verify, probe]
    if: github.event_name != 'pull_request' && vars.EVIDENCE_PUBLICATION_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r automation/news/acquisition/requirements.txt
      - name: Restore complete accepted state without swallowing branch errors
        shell: bash
        run: |
          set -euo pipefail
          remote=$(git ls-remote --heads origin "refs/heads/$DATA_BRANCH")
          if [ -n "$remote" ]; then
            git fetch origin "refs/heads/$DATA_BRANCH"
            echo "EVIDENCE_EXPECTED_HEAD=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
            git worktree add --detach "$RUNNER_TEMP/evidence-pub" FETCH_HEAD
            mkdir -p dist/news/evidence
            cp -a "$RUNNER_TEMP/evidence-pub/dist/news/evidence/." dist/news/evidence/
          else
            echo 'EVIDENCE_EXPECTED_HEAD=' >> "$GITHUB_ENV"
            git worktree add --detach "$RUNNER_TEMP/evidence-pub" HEAD
            git -C "$RUNNER_TEMP/evidence-pub" checkout --orphan evidence-bootstrap
            git -C "$RUNNER_TEMP/evidence-pub" rm -rq --cached .
          fi
      - name: Fetch, validate rights/schema and build immutable snapshot
        run: python -m automation.news.acquisition.run --report "${{ runner.temp }}/evidence-run.json"
      - name: Commit snapshot, SQLite and pointer together (exact-ref lease)
        shell: bash
        run: |
          set -euo pipefail
          pub="$RUNNER_TEMP/evidence-pub"
          mkdir -p "$pub/dist/news/evidence"
          cp -a dist/news/evidence/. "$pub/dist/news/evidence/"
          git -C "$pub" config user.name 'github-actions[bot]'
          git -C "$pub" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$pub" add -f dist/news/evidence
          git -C "$pub" commit -m 'Validated weekly provisional solar evidence'
          python -m automation.news.acquisition.publish "$pub" "$EVIDENCE_EXPECTED_HEAD"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-weekly-receipt
          path: ${{ runner.temp }}/evidence-run.json
          retention-days: 14
