name: Pipeline News V9.61 responsive REPD density acceptance
on:
  pull_request:
    paths:
      - 'uk_renewables_pipeline/202611220100/**'
      - '.github/workflows/pn-v961-repd-density.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  density:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard immutable V9.60 inheritance
        run: |
          python3 - <<'PY'
          import subprocess
          def tree(release):
              raw=subprocess.check_output(['git','ls-tree','-r','-z','HEAD:uk_renewables_pipeline/'+release])
              return {p.decode():m.split()[2].decode() for m,p in
                (item.split(b'\t',1) for item in raw.split(b'\0') if item)}
          old,new=tree('202611212344'),tree('202611220100')
          changed={p for p in old.keys()|new.keys() if old.get(p)!=new.get(p)}
          allowed={'index.html','README.md','CHANGES.md','styles/repd-density.css','repd-density.mjs','tests/repd-density.mjs'}
          assert changed==allowed,(changed,allowed)
          for path in ['data','scripts','news','solar1000','vendor','gridatlas','repd-landscape.mjs','column-scroll.mjs',
                       'styles/compact-register.css','styles/repd-landscape.css']:
              a=subprocess.check_output(['git','rev-parse',f'HEAD:uk_renewables_pipeline/202611212344/{path}'])
              b=subprocess.check_output(['git','rev-parse',f'HEAD:uk_renewables_pipeline/202611220100/{path}'])
              assert a==b,path
          print('PASS: inherited V9.60 data, engine, news, gauges, map and UI assets unchanged')
          PY
      - name: Install pinned browser test runtime
        working-directory: uk_renewables_pipeline/202611220100
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Run portrait and landscape REPD density browser tests
        run: |
          python3 -m http.server 8765 >/tmp/pn-v961-server.log 2>&1 &
          node uk_renewables_pipeline/202611220100/tests/repd-density.mjs
      - name: Keep screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pn-v961-density-browser-evidence
          path: /tmp/pn-v961-density/
          retention-days: 14
