name: Deploy GlobalGrid2050 Pages

on:
  workflow_dispatch:
  # Commits pushed by the V6 workflow use GITHUB_TOKEN and therefore do not emit a
  # second push workflow. Deploy the validated main branch when that workflow finishes.
  workflow_run:
    workflows: ["UK Renewables V6 REPD-Bound Newspaper"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'CNAME'
      - 'employers_competence/**'
      - 'solar_deployment_statistics/**'
      - 'solar_components/**'
      - 'uk_renewables_pipeline/**'
      - 'dist/major_project_news_v5.json'
      - 'dist/major_projects_v5.json'
      - 'dist/major_project_news_v6.json'
      - 'dist/major_projects_v6.json'
      - 'dist/project_identity_v6.json'
      - 'dist/project_identity_v6_integrity.json'
      - 'dist/project_news_links_v6.json'
      - 'dist/repd_source_reconciliation_v6.json'
      - 'dist/renewables_v6_integrity.json'
      - 'dist/manifest_v6.json'
      - 'dist/repd_master.json'
      - 'dist/manifest_v4.json'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
