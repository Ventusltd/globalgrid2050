name: Generate V8 Codebase Blueprint

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  generate-v8-codebase-blueprint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GRIDBOT_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate V8 codebase blueprint
        run: python scripts/generate_v8_codebase_blueprint.py

      - name: Run V8 codebase blueprint checks
        run: python scripts/test_generate_v8_codebase_blueprint.py

      - name: Commit and push V8 codebase blueprint
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"

          git pull --rebase --autostash origin main

          git add \
            solar-bess-topology-v8/CODEBASE_BLUEPRINT.md \
            scripts/generate_v8_codebase_blueprint.py \
            scripts/test_generate_v8_codebase_blueprint.py \
            gridbot_reports/generate_v8_codebase_blueprint.md

          if git diff --cached --quiet; then
            echo "No V8 codebase blueprint changes to commit."
            exit 0
          fi

          git commit -m "Generate V8 codebase blueprint"
          git pull --rebase --autostash origin main
          git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
