name: Pipeline News V9.62 facts-first REPD scan acceptance
on:
  pull_request:
    paths:
      - 'uk_renewables_pipeline/202611220125/**'
      - '.github/workflows/pn-v962-repd-scan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard V9.61 immutable data and model inheritance
        run: |
          python3 - <<'PY'
          import subprocess
          def tree(version):
              raw=subprocess.check_output(['git','ls-tree','-r','-z','HEAD:uk_renewables_pipeline/'+version])
              return {p.decode():m.split()[2].decode() for m,p in (part.split(b'\t',1) for part in raw.split(b'\0') if part)}
          old,new=tree('202611220100'),tree('202611220125')
          diff={p for p in old.keys()|new.keys() if old.get(p)!=new.get(p)}
          allowed={'index.html','README.md','CHANGES.md','styles/repd-scan.css','repd-scan.mjs','tests/repd-scan.mjs'}
          assert diff==allowed,(diff,allowed)
          for path in ['data','scripts','news','solar1000','vendor','gridatlas',
                       'repd-density.mjs','repd-landscape.mjs','column-scroll.mjs',
                       'styles/compact-register.css','styles/repd-density.css']:
              a=subprocess.check_output(['git','rev-parse',f'HEAD:uk_renewables_pipeline/202611220100/{path}']).strip()
              b=subprocess.check_output(['git','rev-parse',f'HEAD:uk_renewables_pipeline/202611220125/{path}']).strip()
              assert a==b,path
          print('PASS: V9.61 inherited exactly, only six expected presentation files changed')
          PY
      - name: Install pinned test browsers
        working-directory: uk_renewables_pipeline/202611220125
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Verify scan and filter behaviour on Chromium and iOS WebKit
        run: |
          python3 -m http.server 8765 >/tmp/pn-v962-http.log 2>&1 &
          node uk_renewables_pipeline/202611220125/tests/repd-scan.mjs
      - name: Preserve phone and landscape screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pn-v962-facts-first-acceptance
          path: /tmp/pn-v962-scan/
          retention-days: 14
