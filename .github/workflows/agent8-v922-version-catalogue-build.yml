name: Agent8 temporary V9.22 immutable version-catalogue generation

# Release-branch-only generator. It is removed before final merge.
# Any failing historical/current verdict stops the builder from committing.
on:
  push:
    branches:
      - release/agent8-v922-20261115
    paths:
      - automation/pipeline_release/registry.json
      - .github/workflows/agent8-v922-version-catalogue-build.yml

permissions:
  contents: write

concurrency:
  group: agent8-v922-version-catalogue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/agent8-v922-20261115
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate new version and independently evaluate every retained historical release
        env:
          VERIFY_OUT: ${{ runner.temp }}/v922-catalogue-validation.json
        run: |
          set -euo pipefail
          python3 automation/pipeline_release/verify.py --browser --write --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('automation/pipeline_release/registry.json').read_text())
          doc=json.loads(Path('uk_renewables_pipeline/versions.json').read_text())
          assert reg['versions'][-1]['id']=='202611151300'
          assert doc['versions'][0]['id']=='202611151300'
          assert len(doc['versions'])==len(reg['versions'])
          assert all(v['verdict']=='PASS' for v in doc['versions'])
          assert 'NOT YET PUBLISHED' in reg['versions'][-1]['state']
          assert '202611151300/' in Path('uk_renewables_pipeline/versions.html').read_text()
          print('PASS: 11 registered versions, frozen history, candidate not falsely marked public')
          PY
      - name: Preserve candidate verdict document even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent8-v922-version-catalogue-evidence
          path: |
            uk_renewables_pipeline/versions.json
            uk_renewables_pipeline/versions.html
            ${{ runner.temp }}/v922-catalogue-validation.json
          if-no-files-found: warn
      - name: Commit only the two generated catalogue files after all verdicts pass
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- uk_renewables_pipeline/versions.json uk_renewables_pipeline/versions.html
          if git diff --cached --quiet; then echo 'Catalogues already current'; exit 0; fi
          git diff --cached --name-only | grep -E '^uk_renewables_pipeline/versions\.(json|html)$'
          git commit -m 'build(agent8): generate V9.22 version verdict catalogue from pinned immutable registry'
          git push origin HEAD:release/agent8-v922-20261115
