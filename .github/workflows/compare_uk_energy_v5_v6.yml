name: Compare UK Energy Tracking V5 and V6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GRIDBOT_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate V5 V6 comparison report
        run: python scripts/compare_uk_energy_v5_v6.py

      - name: Commit comparison report
        run: |
          git config user.name "GridBot"
          git config user.email "gridbot@users.noreply.github.com"
          git add uk_energy_tracking_v6/V5_V6_COMPARISON_REPORT.md
          if git diff --cached --quiet; then
            echo "No comparison report changes to commit."
          else
            git commit -m "Generate V5 V6 energy tracker comparison report"
            git push
          fi
