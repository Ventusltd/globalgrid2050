name: V9.6.1 Exact Commit Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "uk_renewables_pipeline/v9.6.1/**"
      - ".github/workflows/v9-6-1-validate.yml"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Mark exact-commit validation pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='globalgrid/v9.6.1-validation' \
            -f description='V9.6.1 exact-commit validation running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: uk_renewables_pipeline/v9.6.1/package-lock.json
      - name: Install pinned browser harness
        working-directory: uk_renewables_pipeline/v9.6.1
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run V9.6.1 committed-byte gate
        env:
          V9_BROWSER_SMOKE: "1"
        run: bash uk_renewables_pipeline/v9.6.1/tests/run_v9_6_1.sh
      - name: Mark exact-commit validation successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='globalgrid/v9.6.1-validation' \
            -f description='V9.6.1 V9.5.1-parity and mobile-scroll gates passed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Mark exact-commit validation failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='globalgrid/v9.6.1-validation' \
            -f description='V9.6.1 exact-commit or browser gate failed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
