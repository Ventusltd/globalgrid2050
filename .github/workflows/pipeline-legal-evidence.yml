name: Pipeline project A4 legal evidence
on:
  pull_request:
    paths:
      - 'automation/pipeline_legal_evidence/**'
      - 'uk_renewables_pipeline/202611280922/**'
      - '.github/workflows/pipeline-legal-evidence.yml'
permissions:
  contents: read
jobs:
  project-a4:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            automation
            uk_renewables_pipeline/202611280922
      - name: Check canonical project identities and PDF exclusions
        run: |
          node --test automation/pipeline_legal_evidence/link.test.mjs
          node uk_renewables_pipeline/202611280922/tests/a4-legal-model.mjs
      - run: python -m pip install 'playwright==1.56.0' 'pypdf>=5,<7'
      - name: Test A4-only placement and both PDF outputs on desktop and mobile
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: python uk_renewables_pipeline/202611280922/tests/a4-legal-evidence.py
