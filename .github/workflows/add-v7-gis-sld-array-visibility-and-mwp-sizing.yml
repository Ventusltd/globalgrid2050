name: Add V7 GIS SLD Array Visibility And MWp Sizing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-array-sizing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GRIDBOT_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply V7 GIS SLD array visibility and MWp sizing patch
        run: python scripts/add_v7_gis_sld_array_visibility_and_mwp_sizing.py

      - name: Run V7 GIS SLD array sizing checks
        run: python scripts/test_v7_gis_sld_array_sizing_math.py

      - name: Commit and push V7 GIS SLD array sizing update
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"

          git pull --rebase --autostash origin main
          git add \
            solar-bess-topology-v7/gis-sld-financial-sandbox/index.html \
            solar-bess-topology-v7/gis-sld-financial-sandbox/gis-sld-v5-state.js \
            solar-bess-topology-v7/gis-sld-financial-sandbox/gis-sld-v5-ui.js \
            solar-bess-topology-v7/gis-sld-financial-sandbox/gis-sld-v5-drawing.js \
            solar-bess-topology-v7/gis-sld-financial-sandbox/gis-sld-v5.css \
            scripts/add_v7_gis_sld_array_visibility_and_mwp_sizing.py \
            scripts/test_v7_gis_sld_array_sizing_math.py \
            gridbot_reports/add_v7_gis_sld_array_visibility_and_mwp_sizing.md

          if git diff --cached --quiet; then
            echo "No V7 array sizing changes to commit."
            exit 0
          fi

          git commit -m "Add V7 GIS SLD array visibility and MWp sizing"
          git pull --rebase --autostash origin main
          git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
