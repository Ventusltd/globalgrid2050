name: REPD analytics core source tests
on:
  pull_request:
    paths:
      - 'automation/repd_reporting/**'
      - '.github/workflows/repd-analytics-core.yml'
  workflow_dispatch:
jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source aggregation, period, unit and energy scenarios
        run: node --test automation/repd_reporting/v1/tests/aggregate.test.mjs
