name: Repair V6 Chart Inspect Arrows

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-v6-chart-inspect-arrows
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run repair script
        run: python scripts/repair_v6_chart_inspect_arrows.py

      - name: Commit controlled repair
        run: |
          set -e
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"
          git add uk_energy_tracking_v6/price_history_chart/render_price_chart/render_price_chart.js uk_energy_tracking_v6/V6_REPAIR_CHART_INSPECT_ARROWS_REPORT.md
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Repair V6 chart inspect arrows"
            git pull --rebase
            git push
          else
            echo "No repair changes to commit"
          fi
