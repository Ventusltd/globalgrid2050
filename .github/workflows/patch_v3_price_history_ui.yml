name: Patch V3 price history UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-v3-price-history-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository as GridBot
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GRIDBOT_PAT }}
          fetch-depth: 0

      - name: Configure GridBot identity
        run: |
          git config user.name "GridBot"
          git config user.email "gridbot@globalgrid2050.com"

      - name: Patch V3 price history UI
        run: python scripts/patch_v3_price_history_ui.py

      - name: Validate scoped V3 files only
        run: |
          test -f uk_energy_tracking_v3/index.md
          test -f uk_energy_tracking_v3/price-history-ui.css
          test -f uk_energy_tracking_v3/WORK_DIARY.md
          grep -q 'href="/uk_energy_tracking_v3/price-history-ui.css"' uk_energy_tracking_v3/index.md
          grep -q '#electricity-price-history-panel table.price-history-table' uk_energy_tracking_v3/price-history-ui.css
          ! grep -q "@import url('/uk_energy_tracking_v3/price-history-ui.css')" uk_energy_tracking_v3/index.md
          if git diff --name-only | grep -v -E '^(uk_energy_tracking_v3/index.md|uk_energy_tracking_v3/price-history-ui.css|uk_energy_tracking_v3/WORK_DIARY.md)$'; then
            echo "Unexpected files changed"
            git diff --name-only
            exit 1
          fi

      - name: Commit and push V3 UI patch
        run: |
          git add uk_energy_tracking_v3/index.md uk_energy_tracking_v3/price-history-ui.css uk_energy_tracking_v3/WORK_DIARY.md
          if git diff --cached --quiet; then
            echo "No V3 UI changes to commit"
            exit 0
          fi
          git commit -m "Patch V3 price history table UI"
          git pull --rebase origin main
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "Push failed on attempt ${attempt}, retrying after rebase"
            git pull --rebase origin main
            sleep 5
          done
          exit 1
