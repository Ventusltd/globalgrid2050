name: Create V8 BESS Electrical Topology Review

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-v8-bess-electrical-topology-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GRIDBOT_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create V8 BESS electrical topology review app
        run: python scripts/create_v8_bess_electrical_topology_review.py

      - name: Run V8 BESS electrical topology review checks
        run: python scripts/test_create_v8_bess_electrical_topology_review.py

      - name: Commit and push V8 BESS electrical topology review app
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"

          git pull --rebase --autostash origin main

          git add \
            solar-bess-topology-v8/index.html \
            solar-bess-topology-v8/README.md \
            solar-bess-topology-v8/bess-electrical-topology-review/index.html \
            solar-bess-topology-v8/bess-electrical-topology-review/bess-electrical-topology-review.css \
            solar-bess-topology-v8/bess-electrical-topology-review/bess-electrical-topology-review.js \
            solar-bess-topology-v8/bess-electrical-topology-review/README.md \
            scripts/create_v8_bess_electrical_topology_review.py \
            scripts/test_create_v8_bess_electrical_topology_review.py \
            gridbot_reports/create_v8_bess_electrical_topology_review.md

          if git diff --cached --quiet; then
            echo "No V8 BESS electrical topology review changes to commit."
            exit 0
          fi

          git commit -m "Create V8 BESS electrical topology review app"
          git pull --rebase --autostash origin main
          git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
