name: Add V7 GIS SLD Site Intelligence Panel

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  add-site-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GRIDBOT_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply V7 GIS SLD site intelligence panel patch
        run: python scripts/add_v7_gis_sld_site_intelligence_panel.py

      - name: Run static checks
        run: python scripts/test_v7_gis_sld_site_intelligence_panel.py

      - name: Commit and push site intelligence panel update
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"

          git pull --rebase --autostash origin main
          git add \
            solar-bess-topology-v7/gis-sld-financial-sandbox/index.html \
            solar-bess-topology-v7/gis-sld-financial-sandbox/gis-sld-v5-ui.js \
            solar-bess-topology-v7/gis-sld-financial-sandbox/gis-sld-v5.css \
            scripts/add_v7_gis_sld_site_intelligence_panel.py \
            scripts/test_v7_gis_sld_site_intelligence_panel.py \
            gridbot_reports/add_v7_gis_sld_site_intelligence_panel.md

          if git diff --cached --quiet; then
            echo "No site intelligence panel changes to commit."
            exit 0
          fi

          git commit -m "Add V7 GIS SLD site intelligence panel"
          git pull --rebase --autostash origin main
          git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
