name: Repair V6 Event Boxes Visible

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run V6 event boxes visible repair
        run: python scripts/repair_v6_event_boxes_visible.py

      - name: Commit controlled V6 repair
        run: |
          git config user.name "GridBot"
          git config user.email "gridbot@users.noreply.github.com"
          git add uk_energy_tracking_v6/price_history_chart/render_price_chart/render_price_chart.js
          git add uk_energy_tracking_v6/index.md
          git add uk_energy_tracking_v6/V6_REPAIR_EVENT_BOXES_VISIBLE_REPORT.md
          git diff --cached --quiet && echo "No V6 event boxes visible changes to commit" && exit 0
          git commit -m "Repair V6 event boxes visible"
          git push
