name: Rebuild V8 BESS From V7 GIS Frame

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  rebuild-v8-bess-from-v7-gis-frame:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GRIDBOT_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild V8 BESS from V7 GIS frame
        run: python scripts/rebuild_v8_bess_from_v7_gis_frame.py

      - name: Run V8 BESS V7 frame checks
        run: python scripts/test_rebuild_v8_bess_from_v7_gis_frame.py

      - name: Commit and push V8 BESS V7 frame rebuild
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"

          git pull --rebase --autostash origin main

          git add \
            solar-bess-topology-v8/index.html \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/index.html \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/gis-sld-v5.css \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/gis-sld-v5-config.js \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/gis-sld-v5-helpers.js \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/gis-sld-v5-state.js \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/gis-sld-v5-substations.js \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/gis-sld-v5-map.js \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/gis-sld-v5-calculations.js \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/gis-sld-v5-finance.js \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/gis-sld-v5-ui-core.js \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/gis-sld-v5-drawing.js \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/gis-sld-v5-export.js \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/gis-sld-v5-ui.js \
            solar-bess-topology-v8/bess-gis-sld-financial-sandbox/README.md \
            scripts/rebuild_v8_bess_from_v7_gis_frame.py \
            scripts/test_rebuild_v8_bess_from_v7_gis_frame.py \
            gridbot_reports/rebuild_v8_bess_from_v7_gis_frame.md

          if git diff --cached --quiet; then
            echo "No V8 BESS V7 frame rebuild changes to commit."
            exit 0
          fi

          git commit -m "Rebuild V8 BESS from V7 GIS frame"
          git pull --rebase --autostash origin main
          git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
