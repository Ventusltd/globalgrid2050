name: 202608301102 Repair Atlas V9 catalogue synchronisation
run-name: Repair idempotent Atlas V9 catalogue publisher from ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/202608301102-repair-atlas-v9-catalogue-sync.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: globalgrid2050-202608301102-atlas-v9-catalogue-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Patch stale homepage anchor and retire duplicate synchroniser
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact repair source boundary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 30
          persist-credentials: true

      - name: Replace literal anchor with semantic idempotent ordering
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          target=scripts/202608300232-sync-promoted-gridatlas-v9.py
          test -f "$target"
          python3 - <<'PY'
          from pathlib import Path
          import re
          import runpy
          import shutil

          path = Path('scripts/202608300232-sync-promoted-gridatlas-v9.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'(?ms)^def update_homepage\([^\n]*\):\n.*?(?=^def |\Z)')
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'expected one update_homepage function, found {len(matches)}')

          replacement = '''def update_homepage(homepage, release_id):
              """Place exactly one current V9 entry immediately after V8, without literal-byte anchors."""
              import re

              release_url = f"https://ventusltd.github.io/gridatlas/{release_id}/"
              text = homepage.read_text(encoding="utf-8")
              lines = text.splitlines()

              # Remove only the mutable current-release catalogue object. Immutable historic V9 rows remain.
              current_name = "UK Grid Atlas V9 — Current Verified Release"
              lines = [
                  line for line in lines
                  if not (
                      current_name in line
                      and ("{ name:" in line or "{ name :" in line or "{name:" in line)
                  )
              ]

              section_start = next(
                  (index for index, line in enumerate(lines)
                   if re.search(r'name\s*:\s*["\\\']UK Grid Tracking["\\\']', line)),
                  None,
              )
              if section_start is None:
                  raise RuntimeError("UK Grid Tracking homepage section not found")

              section_end = next(
                  (index for index in range(section_start + 1, len(lines))
                   if lines[index].strip() == "]},"),
                  None,
              )
              if section_end is None:
                  raise RuntimeError("UK Grid Tracking homepage section is not closed")

              v8_index = next(
                  (index for index in range(section_start + 1, section_end)
                   if "repd_grid_atlasv8/" in lines[index]),
                  None,
              )
              if v8_index is None:
                  raise RuntimeError("Atlas V8 semantic URL anchor not found in UK Grid Tracking")

              indent = re.match(r"^\s*", lines[v8_index]).group(0)
              entry = (
                  f'{indent}{{ name:"{current_name}", url:"{release_url}", '
                  f'note:"CURRENT VERIFIED · {release_id} · actual 400 kV render gates · '
                  'desktop/mobile · canonical repd_ref deep links · V8 and immutable prior V9 releases preserved" },'
              )
              lines.insert(v8_index + 1, entry)
              text = "\n".join(lines) + "\n"

              # Keep the prominent platform link current. Add it once only when absent.
              platform = (
                  f'<div class="os-strip"><a href="{release_url}">UK Grid Atlas V9 — Current Verified Release</a>'
                  f'<span class="live-status">{release_id.removesuffix("-atlas-v9")} · verified live</span></div>'
              )
              platform_pattern = re.compile(
                  r'<div class="os-strip"><a href="https://ventusltd\.github\.io/gridatlas/[^"<]+/">'
                  r'UK Grid Atlas V9 — Current Verified Release</a><span class="live-status">[^<]*</span></div>'
              )
              text, replaced = platform_pattern.subn(platform, text)
              if replaced > 1:
                  raise RuntimeError("multiple current Atlas V9 platform links found")
              if replaced == 0:
                  marker = '      <input type="text" id="gridSearch"'
                  if text.count(marker) != 1:
                      raise RuntimeError("GlobalGrid search marker not found exactly once")
                  text = text.replace(marker, f'      {platform}\n{marker}')

              if text.count(f'name:"{current_name}"') != 1:
                  raise RuntimeError("current Atlas V9 catalogue object is not unique")
              homepage.write_text(text, encoding="utf-8", newline="\n")


'''
          repaired = text[:matches[0].start()] + replacement + text[matches[0].end():]
          path.write_text(repaired, encoding='utf-8', newline='\n')

          # Prove syntax and idempotent ordering against the exact current homepage before committing.
          compile(repaired, str(path), 'exec')
          temp = Path('/tmp/globalgrid-index.html')
          shutil.copyfile('index.html', temp)
          namespace = runpy.run_path(str(path))
          update = namespace['update_homepage']
          release_id = '202608292311-atlas-v9'
          update(temp, release_id)
          once = temp.read_text(encoding='utf-8')
          update(temp, release_id)
          twice = temp.read_text(encoding='utf-8')
          if once != twice:
              raise SystemExit('homepage update is not idempotent')
          lines = twice.splitlines()
          v8 = next(i for i, line in enumerate(lines) if 'repd_grid_atlasv8/' in line)
          current = next(i for i, line in enumerate(lines) if 'name:"UK Grid Atlas V9 — Current Verified Release"' in line)
          if current != v8 + 1:
              raise SystemExit('current V9 is not immediately after V8')
          PY
          python3 -m py_compile "$target"
          git diff --check
          test "$(git diff --name-only)" = "$target"

      - name: Compare-and-swap source-only repair onto main
        shell: bash
        run: |
          set -euo pipefail
          target=scripts/202608300232-sync-promoted-gridatlas-v9.py
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add "$target"
          test "$(git diff --cached --name-only)" = "$target"
          git config user.name globalgrid2050-atlas-sync-repair-bot
          git config user.email actions@users.noreply.github.com
          git commit -m '202608301102: make Atlas V9 catalogue publisher semantic and idempotent'
          git push origin HEAD:main

      - name: Disable superseded duplicate Atlas synchroniser
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/202608300310-sync-current-gridatlas-v9.yml/disable"
          code="$(curl --silent --show-error --output /tmp/disable-response --write-out '%{http_code}' \
            --request PUT \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$endpoint")"
          test "$code" = 204
