name: V9.69 Expanded REPD portrait and MAP position QA
on:
  pull_request:
    paths:
      - 'uk_renewables_pipeline/202611221850/**'
      - '.github/workflows/pn-v969-map-portrait.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check immutable source assets and release contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          new=Path('uk_renewables_pipeline/202611221850')
          old=Path('uk_renewables_pipeline/202611221705')
          for name in ['report-a4.mjs','report-model.mjs','report-pdf.mjs','styles/report-a4.css','scripts/plugins/projects-v9-8.js']:
              assert (new/name).read_bytes()==(old/name).read_bytes(),name
          js=(new/'repd-expanded.mjs').read_text()
          css=(new/'styles/repd-expanded.css').read_text()
          assert 'syncMapColumn()' in js and 'clearMapColumn()' in js
          assert 'landscapeGate' not in js
          assert '.pn-expanded-map-cell' in css
          assert 'pn-report-launch' in css
          print('PASS immutable report, source model and view-only MAP')
          PY
      - name: Install test browsers
        working-directory: uk_renewables_pipeline/202611221850
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Start local HTTP server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pn-v969-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8765/uk_renewables_pipeline/202611221850/; then break; fi
            sleep 1
          done
      - name: Test actual Chromium and WebKit in both orientations
        working-directory: uk_renewables_pipeline/202611221850
        run: node tests/repd-expanded.mjs
