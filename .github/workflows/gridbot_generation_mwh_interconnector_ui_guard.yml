name: GridBot Generation MWh Interconnector UI Guard

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
      commit_reports:
        description: Commit reports and UI guard changes
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
permissions:
  contents: write

concurrency:
  group: gridbot-generation-mwh-interconnector-ui-guard
  cancel-in-progress: false

jobs:
  generation-mwh-interconnector-ui-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT }}

      - name: Sync latest main before processing
        run: git pull --ff-only origin main

      - name: Run audit
        if: ${{ github.event.inputs.mode == 'audit' }}
        run: python scripts/gridbot_generation_mwh_interconnector_ui_guard.py

      - name: Run apply
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: python scripts/gridbot_generation_mwh_interconnector_ui_guard.py --apply

      - name: Upload UI guard report
        uses: actions/upload-artifact@v4
        with:
          name: generation-mwh-interconnector-ui-guard-${{ github.event.inputs.mode }}
          path: |
            data_science_protocol/audit_reports/GENERATION_MWH_INTERCONNECTOR_UI_GUARD_LATEST.md
            data_science_protocol/audit_reports/json/GENERATION_MWH_INTERCONNECTOR_UI_GUARD_LATEST.json

      - name: Commit audit report only
        if: ${{ github.event.inputs.commit_reports == 'true' && github.event.inputs.mode == 'audit' }}
        run: |
          git config user.name "Gridbot"
          git config user.email "gridbot@users.noreply.github.com"
          git add scripts/gridbot_generation_mwh_interconnector_ui_guard.py
          git add .github/workflows/gridbot_generation_mwh_interconnector_ui_guard.yml
          git add data_science_protocol/audit_reports/GENERATION_MWH_INTERCONNECTOR_UI_GUARD_LATEST.md
          git add data_science_protocol/audit_reports/json/GENERATION_MWH_INTERCONNECTOR_UI_GUARD_LATEST.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "gridbot: generation mwh interconnector ui guard audit"
            git push origin HEAD:main
          fi

      - name: Commit UI guard changes and report
        if: ${{ github.event.inputs.commit_reports == 'true' && github.event.inputs.mode == 'apply' }}
        run: |
          git config user.name "Gridbot"
          git config user.email "gridbot@users.noreply.github.com"
          git add scripts/gridbot_generation_mwh_interconnector_ui_guard.py
          git add .github/workflows/gridbot_generation_mwh_interconnector_ui_guard.yml
          git add uk_energy_tracking_v6_2/generation_history/render_generation_mwh_aggregates.js
          git add uk_energy_tracking_v6_2/generation_history/control_generation_mwh_aggregates.js
          git add uk_energy_tracking_v6_2/generation_history/index.md
          git add data_science_protocol/audit_reports/GENERATION_MWH_INTERCONNECTOR_UI_GUARD_LATEST.md
          git add data_science_protocol/audit_reports/json/GENERATION_MWH_INTERCONNECTOR_UI_GUARD_LATEST.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "gridbot: generation mwh interconnector ui guard apply"
            git push origin HEAD:main
          fi
