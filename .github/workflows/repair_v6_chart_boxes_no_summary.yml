name: Repair V6 Chart Boxes No Summary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run V6 chart boxes no summary repair
        run: python scripts/repair_v6_chart_boxes_no_summary.py

      - name: Commit controlled V6 repair
        run: |
          git config user.name "GridBot"
          git config user.email "gridbot@users.noreply.github.com"
          git add uk_energy_tracking_v6/price_history_chart/render_price_chart/render_price_chart.js
          git add uk_energy_tracking_v6/styles/app.css
          git add uk_energy_tracking_v6/index.md
          git add uk_energy_tracking_v6/V6_REPAIR_CHART_BOXES_NO_SUMMARY_REPORT.md
          git diff --cached --quiet && echo "No V6 chart boxes no summary changes to commit" && exit 0
          git commit -m "Repair V6 chart boxes no summary"
          git push
