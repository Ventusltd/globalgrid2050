name: Patch V3 price history correctness

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/patch_v3_price_history_correctness.py
      - run: |
          git config user.name "GridBot"
          git config user.email "gridbot@globalgrid2050.com"
          git add uk_energy_tracking_v3/index.md uk_energy_tracking_v3/price-history-ui.js uk_energy_tracking_v3/price-history-ui.css uk_energy_tracking_v3/WORK_DIARY.md
          git diff --cached --quiet && exit 0
          git commit -m "Patch V3 price history correctness"
          git pull --rebase origin main
          git push origin HEAD:main
