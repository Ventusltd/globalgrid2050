name: Generator device review evidence
on:
  pull_request:
    paths: ['testcode/20260915050706/**', '.github/workflows/generator-device-review.yml']
  push:
    branches: [main]
    paths: ['testcode/20260915050706/**', '.github/workflows/generator-device-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify published report hashes and explicit unmet gates
        run: node testcode/20260915050706/verify-evidence.mjs
