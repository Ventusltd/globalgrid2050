name: Pipeline headlines (three times a day, data branch)
# Owner, 14 Nov 2026: "Improve the news dashboard it's bad. It's stuck on the same news article."
# An owner-requested scheduled workflow (an exception to the 000_freeze manual-only rule, like datacentre-news.yml and
# the monthly REPD check). It reads the public RSS/Atom feeds listed in automation/news/pipeline_feeds.json, keeps
# headlines and links only (automation/news/pipeline_headlines.py), and publishes ONE file,
# dist/pipeline_headlines.json, to the branch pipeline-news-data. It never pushes to main, never opens a PR, never
# deploys: the Pipeline News page reads the file from raw.githubusercontent.com on that branch. A push made with
# GITHUB_TOKEN starts no other workflow. One feed failing is recorded in the file's "feeds" list and does not fail
# the job; the job fails only when every feed failed and there is no earlier file.
# Three slots a day because this repository's scheduled runs arrive hours late and some are dropped: one late or
# missing slot then costs hours, not a day.
# On a pull request that touches the fetcher, the "probe" job (read-only, writes to no branch) fetches every feed in
# the list and reports feed health and the headlines the rules keep, so a feed list can be judged before merge.
on:
  schedule:
    - cron: '41 4,10,16 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'automation/news/pipeline_headlines.py'
      - 'automation/news/pipeline_feeds.json'
      - 'automation/news/datacentre_feed.py'
      - 'automation/news/names.py'
      - 'automation/news/schema/pipeline-headlines.v1.schema.json'
      - 'automation/news/tests/test_pipeline_headlines.py'
      - 'automation/news/tests/fixtures/pipeline/**'
      - '.github/workflows/pipeline-headlines.yml'
permissions:
  contents: read
concurrency:
  group: pipeline-headlines-${{ github.event_name == 'pull_request' && github.ref || 'data' }}
  cancel-in-progress: false
env:
  DATA_BRANCH: pipeline-news-data
jobs:
  probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests (offline fixtures)
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q -p no:cacheprovider automation/news/tests/test_pipeline_headlines.py
      - name: Fetch every feed in the list and report (no data file, no branch written)
        run: |
          python automation/news/pipeline_headlines.py --probe "$RUNNER_TEMP/pipeline-headlines-probe.md"
          cat "$RUNNER_TEMP/pipeline-headlines-probe.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-headlines-probe
          path: ${{ runner.temp }}/pipeline-headlines-probe.md
          retention-days: 14
  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests (offline fixtures)
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q -p no:cacheprovider automation/news/tests/test_pipeline_headlines.py
      - name: Bring in the previous file from the data branch (keeps older items)
        run: |
          mkdir -p dist
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            git show FETCH_HEAD:dist/pipeline_headlines.json > dist/pipeline_headlines.json || rm -f dist/pipeline_headlines.json
          fi
      - name: Fetch feeds and build dist/pipeline_headlines.json
        run: python automation/news/pipeline_headlines.py --out dist/pipeline_headlines.json
      - name: Summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("dist/pipeline_headlines.json")
          if not p.exists():
              print("no output"); raise SystemExit
          d = json.loads(p.read_text())
          print(f"**{d['status']}**  {json.dumps(d['counts'])}\n")
          print("| feed | status | entries | newest | kept | error |\n|---|---|---|---|---|---|")
          for f in d["feeds"]:
              print(f"| {f['url']} | {f['status']} | {f.get('entries','')} | {(f.get('newest') or '')[:10]} | {f.get('kept','')} | {f.get('error','')} |")
          print("\n| date | category | possible match | source | title |\n|---|---|---|---|---|")
          for i in d["items"][:25]:
              m = i["possible_match"]
              print(f"| {(i['date'] or i['first_seen'])[:10]} | {i['category']} | {('REPD ' + m['repd_ref']) if m else ''} | {i['source']} | {i['title'].replace('|', '/')} |")
          EOF
      - name: Publish to the data branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pub="$RUNNER_TEMP/pub"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git worktree add --detach "$pub" FETCH_HEAD
          else
            git worktree add --detach "$pub" HEAD
            git -C "$pub" checkout --orphan pipeline-news-tmp
            git -C "$pub" rm -rq --cached .
            find "$pub" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p "$pub/dist"
          cp dist/pipeline_headlines.json "$pub/dist/pipeline_headlines.json"
          printf '%s\n' "Published by .github/workflows/pipeline-headlines.yml. Headlines and links only." \
            "Read by the Pipeline News page. Do not edit by hand." > "$pub/README.txt"
          git -C "$pub" add dist/pipeline_headlines.json README.txt
          if git -C "$pub" diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          git -C "$pub" commit -q -m "pipeline headlines $(date -u +%Y-%m-%dT%H:%MZ)"
          git -C "$pub" push origin "HEAD:refs/heads/$DATA_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-headlines
          path: dist/pipeline_headlines.json
          retention-days: 14
