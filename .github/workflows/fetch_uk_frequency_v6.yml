name: fetch_uk_frequency_v6

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      burst_samples:
        description: Number of samples
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3', '6', '12']
      rolling_hours:
        description: Rolling retention window in hours
        required: true
        default: '24'
        type: choice
        options: ['6', '12', '24']

permissions:
  contents: write

concurrency:
  group: uk-frequency-v6
  cancel-in-progress: false

jobs:
  update-frequency:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      - name: Resolve frequency run settings
        id: settings
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "burst_samples=${{ github.event.inputs.burst_samples }}" >> "$GITHUB_OUTPUT"
            echo "rolling_hours=${{ github.event.inputs.rolling_hours }}" >> "$GITHUB_OUTPUT"
          else
            echo "burst_samples=1" >> "$GITHUB_OUTPUT"
            echo "rolling_hours=24" >> "$GITHUB_OUTPUT"
          fi

      - name: Run V6 UK grid frequency collector
        env:
          GG_FREQUENCY_BURST_SAMPLES: ${{ steps.settings.outputs.burst_samples }}
          GG_FREQUENCY_SLEEP_SECONDS: '120'
          GG_FREQUENCY_ROLLING_HOURS: ${{ steps.settings.outputs.rolling_hours }}
          GG_FREQUENCY_LOOKBACK_MINUTES: '180'
        run: python scripts/update_uk_frequency_v6.py

      - name: Commit V6 frequency feed and report
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"
          git add uk_energy_tracking_v6/grid_frequency_history.csv uk_energy_tracking_v6/live_grid_frequency.json uk_energy_tracking_v6/grid_frequency_weekly_health.csv uk_energy_tracking_v6/live_grid_frequency_weekly_health.json gridbot_reports/uk_frequency_v6_report.md
          if git diff --cached --quiet; then
            echo "No staged V6 frequency changes to commit"
            exit 0
          fi
          git commit -m "Automated UK frequency update V6"
          git pull --rebase
          git push
