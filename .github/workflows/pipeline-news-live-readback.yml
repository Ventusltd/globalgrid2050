name: Pipeline News live browser readback

on:
  push:
    branches: [main]
    paths:
      - 'uk_renewables_pipeline/current.json'
      - '.github/workflows/pipeline-news-live-readback.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-news-live-readback
  cancel-in-progress: false

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'

      - name: Install pinned headless browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Read back the deployed app in Chromium
        env:
          EVIDENCE: browser-evidence/pipeline-news-live.json
        run: |
          mkdir -p browser-evidence
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          const contract = JSON.parse(fs.readFileSync('uk_renewables_pipeline/current.json', 'utf8'));
          if (contract.schema !== 'globalgrid2050.pipeline-news-current.v1') throw new Error('bad current contract');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            const consoleErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => consoleErrors.push(err.message));
            let lastError = null;
            for (let attempt = 1; attempt <= 30; attempt++) {
              try {
                const response = await page.goto(contract.url + '?readback=' + Date.now(), {waitUntil:'domcontentloaded', timeout:30000});
                assert(response && response.status() === 200, 'live HTML did not return 200');
                await page.waitForSelector('#newsMeta', {timeout:15000});
                await page.waitForFunction(() => {
                  const text = document.querySelector('#newsMeta')?.textContent || '';
                  return text && !text.toLowerCase().includes('loading');
                }, {timeout:30000});
                await page.waitForFunction(expected => {
                  const got = [...document.querySelectorAll('#stories h3')].map(e => e.textContent.trim());
                  return expected.every(h => got.includes(h));
                }, contract.expected_headlines, {timeout:45000});
                lastError = null;
                break;
              } catch (error) {
                lastError = error;
                await new Promise(r => setTimeout(r, 5000));
              }
            }
            if (lastError) throw lastError;
            const title = await page.title();
            const meta = (await page.locator('#newsMeta').innerText()).trim();
            const headlines = await page.locator('#stories h3').allTextContents();
            const sourceLabels = await page.locator('#stories .news-quality').allTextContents();
            console.log('OBSERVED_META=' + JSON.stringify(meta));
            console.log('OBSERVED_HEADLINES=' + JSON.stringify(headlines.slice(0,20)));
            console.log('OBSERVED_SOURCE_LABELS=' + JSON.stringify(sourceLabels.slice(0,20)));
            fs.writeFileSync(process.env.EVIDENCE, JSON.stringify({
              schema:'globalgrid2050.pipeline-news-live-readback.v1',
              status:'observed-before-assertions',
              checked_url:contract.url,
              release_id:contract.release_id,
              source_product_commit:contract.source_product_commit,
              title, meta,
              expected_headlines:contract.expected_headlines,
              observed_headlines:headlines.slice(0,20),
              observed_source_labels:sourceLabels.slice(0,20),
              console_errors:consoleErrors,
              checked_at:new Date().toISOString()
            },null,2)+'\\n');
            for (const headline of contract.expected_headlines) assert(headlines.includes(headline), 'missing live headline: ' + headline);
            for (const priority of contract.expected_source_priorities) assert(sourceLabels.some(x => x.includes('UK SOURCE P' + priority)), 'missing source priority P' + priority);
            assert(meta.includes('priority UK source items'), 'live metadata does not identify priority source items');
            assert(!sourceLabels.some(x => /PRIMARY_MATCH/.test(x) && /UK SOURCE/.test(x)), 'discovery item became project signal');
            await page.screenshot({path:'browser-evidence/pipeline-news-live.png', fullPage:true});
            const receipt = {
              schema:'globalgrid2050.pipeline-news-live-readback.v1',
              status:'pass',
              checked_url:contract.url,
              release_id:contract.release_id,
              source_product_commit:contract.source_product_commit,
              title,
              meta,
              expected_headlines:contract.expected_headlines,
              observed_headlines:headlines.slice(0,20),
              observed_source_labels:sourceLabels.slice(0,20),
              console_errors:consoleErrors,
              checked_at:new Date().toISOString()
            };
            fs.writeFileSync(process.env.EVIDENCE, JSON.stringify(receipt,null,2)+'\n');
            console.log(JSON.stringify(receipt,null,2));
            await browser.close();
          })().catch(error => {
            fs.writeFileSync(process.env.EVIDENCE, JSON.stringify({schema:'globalgrid2050.pipeline-news-live-readback.v1',status:'fail',error:String(error.stack||error),checked_at:new Date().toISOString()},null,2)+'\n');
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Preserve exact browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pipeline-news-live-readback
          path: browser-evidence
          if-no-files-found: error
          retention-days: 30
