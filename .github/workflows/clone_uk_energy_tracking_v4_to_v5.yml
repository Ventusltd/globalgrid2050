name: Clone UK Energy Tracking V4 to V5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone V4 to V5
        run: python scripts/clone_uk_energy_tracking_v4_to_v5.py

      - name: Commit V5 clone
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          set -e
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"
          git add uk_energy_tracking_v5 index.html gridbot_reports/clone_uk_energy_tracking_v4_to_v5.md
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Clone UK Energy Tracking V4 to V5"
            git pull --rebase https://${PAT}@github.com/${{ github.repository }}.git main
            git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
          else
            echo "No V5 clone changes to commit"
          fi
