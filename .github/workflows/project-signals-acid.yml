name: Project signals, acid test (all suites together, and the published file)
# Acid cycle of 14 Nov 2026, after the independent code review on neural-link issue 19 (finding 4: "actual
# merged-head integration is not tested"). Read-only: this workflow writes to no branch, opens no pull request
# and deploys nothing.
#
# Job "suites": at the tested commit, every project-signals test suite in one job (official, trade, index,
# planning file, combiner and the acid suite; the suites are discovered, so one added later is run too), then
# ONE table in the job summary: suite, tests, passed, failed.
# A test marked "known failing until the fixer's PR" (a strict xfail naming the review finding it covers) is
# counted in its own column and listed under the table; if such a test passes while the code still declares
# schema version 1 it is reported as failed, and on code that declares version 2 the marker is not applied.
# The job fails when any suite has a failure or did not run.
#
# Job "live": reads dist/project_signals.json from the branch project-signals-data and checks the real file:
# schema, no project with nothing, no item on REPD 9050 without "solar", no undated item above a dated one,
# counts by tier equal to the items, real dates, and generated_at not older than two days unless the file says
# stale. The summary names each rule that fails. On the daily schedule and on a manual run the job fails when a
# rule fails; on a pull request it only reports (the published file is not what the pull request changes).
on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'automation/news/signals/**'
      - 'automation/news/datacentre_feed.py'
      - 'automation/news/tests/test_signals_*.py'
      - 'automation/news/tests/acid_*.py'
      - 'automation/news/tests/fixtures/acid/**'
      - '.github/workflows/project-signals*.yml'
permissions:
  contents: read
concurrency:
  group: project-signals-acid-${{ github.ref }}
  cancel-in-progress: true
env:
  DATA_BRANCH: project-signals-data
jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every signals suite, then one table (suite, tests, passed, failed); fails if any suite failed
        run: |
          python -m pip install --quiet pytest
          python automation/news/tests/acid_report.py --run "$RUNNER_TEMP/acid" --commit "$(git rev-parse HEAD)" \
            --summary "$GITHUB_STEP_SUMMARY" --json "$RUNNER_TEMP/acid/suites.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-signals-acid-suites
          path: ${{ runner.temp }}/acid/
          retention-days: 14
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the published file from the data branch
        run: |
          mkdir -p "$RUNNER_TEMP/live"
          code=0
          git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null || code=$?
          if [ "$code" = "2" ]; then
            echo "## Project signals: live acid check" >> "$GITHUB_STEP_SUMMARY"
            echo "**Failed: schema** (the branch $DATA_BRANCH does not exist: nothing is published)" >> "$GITHUB_STEP_SUMMARY"
            echo "missing" > "$RUNNER_TEMP/live/state"
          elif [ "$code" != "0" ]; then
            echo "::error::could not ask the remote for $DATA_BRANCH (exit $code)"; exit 1
          else
            git fetch --depth=1 origin "$DATA_BRANCH"
            echo "DATA_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
            git show FETCH_HEAD:dist/project_signals.json > "$RUNNER_TEMP/live/project_signals.json"
            echo "read" > "$RUNNER_TEMP/live/state"
          fi
      - name: Acid check of the real file (the summary names each rule that fails)
        run: |
          code=0
          if [ "$(cat "$RUNNER_TEMP/live/state")" = "read" ]; then
            python automation/news/tests/acid_live.py "$RUNNER_TEMP/live/project_signals.json" \
              --source "dist/project_signals.json on $DATA_BRANCH at ${DATA_SHA:0:12}" --summary "$GITHUB_STEP_SUMMARY" || code=$?
          else
            code=1
          fi
          if [ "$code" != "0" ] && [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "On a pull request the live check only reports: the published file is not what this pull request changes. The daily run fails on the same result." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::live acid check: one or more rules fail on the published file (see the job summary)"
            exit 0
          fi
          exit "$code"
