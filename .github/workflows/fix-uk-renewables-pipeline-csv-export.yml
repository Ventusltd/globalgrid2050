name: Fix UK Renewables Pipeline CSV Export

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  fix-csv-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GRIDBOT_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fix UK renewables pipeline CSV export
        run: python scripts/fix_uk_renewables_pipeline_csv_export.py

      - name: Commit and push CSV export fix
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"

          git pull --rebase --autostash origin main
          git add \
            uk_renewables_pipeline/dashboard.html \
            scripts/fix_uk_renewables_pipeline_csv_export.py \
            gridbot_reports/fix_uk_renewables_pipeline_csv_export.md

          if git diff --cached --quiet; then
            echo "No CSV export changes to commit."
            exit 0
          fi

          git commit -m "Fix UK renewables pipeline CSV export"
          git pull --rebase --autostash origin main
          git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
