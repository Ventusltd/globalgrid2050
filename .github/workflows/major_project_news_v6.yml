name: UK Renewables V6 REPD-Bound Newspaper

# V6 is generated from the complete V5 live app and fails closed on structural,
# DESNZ source, REPD identity, GlobalGrid identity, quantity or headline-quality regression.
on:
  workflow_dispatch:
  issues:
    types: [opened]
  # Temporary bootstrap until the first scope-validated production V6 lands.
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/repd_updater.py'
      - 'scripts/repd_updater_v6_hardened.py'
      - 'scripts/validate_repd_sources_v6.py'
      - 'scripts/build_project_identity_v6.py'
      - 'scripts/build_renewables_v6_dashboard.py'
      - 'scripts/harden_renewables_v6_dashboard.py'
      - 'scripts/major_project_news_v6.py'
      - 'scripts/major_project_news_v6_hardened.py'
      - 'scripts/enrich_renewables_v6_identity.py'
      - 'scripts/validate_project_identity_v6.py'
      - 'scripts/validate_renewables_v6_scope.py'
      - 'scripts/promote_renewables_v6_homepage.py'
      - 'uk_renewables_pipeline/V6_BUILD_PLAN_2026-08-22.md'
      - '.github/workflows/major_project_news_v6.yml'
      - 'uk_renewables_pipeline/dashboard_v5_live.html'
      - 'dist/repd_master.json'

permissions:
  contents: write

concurrency:
  group: uk-renewables-v6-repd-bound
  cancel-in-progress: true

jobs:
  build-validate-publish:
    if: github.event_name != 'issues' || github.event.issue.title == '[OPS] RUN UK RENEWABLES V6'
    runs-on: ubuntu-latest
    # External news discovery remains hard-capped below three minutes. The extra
    # headroom is only Python setup, official CSV/XLSX reconciliation and local gates.
    timeout-minutes: 7
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install REPD and news dependencies
        run: |
          echo install > /tmp/v6_stage
          python -m pip install --disable-pip-version-check pandas pyyaml requests pyproj beautifulsoup4 openpyxl

      - name: Refresh official DESNZ REPD with hardened Q2 schema handling
        run: |
          echo repd_updater > /tmp/v6_stage
          python scripts/repd_updater_v6_hardened.py

      - name: Reconcile official DESNZ CSV against official XLSX by Ref ID
        run: |
          echo repd_source_reconciliation > /tmp/v6_stage
          python scripts/validate_repd_sources_v6.py

      - name: Build canonical GlobalGrid project identity spine
        run: |
          echo project_identity > /tmp/v6_stage
          python scripts/build_project_identity_v6.py

      - name: Build V6 from complete V5 gospel source
        run: |
          echo dashboard_builder > /tmp/v6_stage
          python scripts/build_renewables_v6_dashboard.py
          python scripts/harden_renewables_v6_dashboard.py

      - name: Crawl six-month V6 newspaper within three-minute budget
        run: |
          echo news_crawler > /tmp/v6_stage
          timeout 170s python scripts/major_project_news_v6_hardened.py

      - name: Bind V6 project/news outputs to canonical GlobalGrid IDs
        run: |
          echo identity_enrichment > /tmp/v6_stage
          python scripts/enrich_renewables_v6_identity.py

      - name: Validate GlobalGrid project identity and actual Q2 quantities
        run: |
          echo identity_validator > /tmp/v6_stage
          python scripts/validate_project_identity_v6.py

      - name: Pass 3 scope audit against V1-V5, DESNZ, REPD and newspaper rules
        run: |
          echo scope_validator > /tmp/v6_stage
          python scripts/validate_renewables_v6_scope.py

      - name: Promote scope-validated V6 on root homepage
        run: |
          echo homepage_promotion > /tmp/v6_stage
          python scripts/promote_renewables_v6_homepage.py

      - name: Commit only fully validated V6 output
        run: |
          echo publish > /tmp/v6_stage
          git config user.name "Ventus-Bot"
          git config user.email "bot@ventus.ltd"
          rm -f dist/renewables_v6_failure.txt
          git add -A \
            index.html \
            dist/repd_master.json \
            dist/manifest_v4.json \
            dist/repd_source_reconciliation_v6.json \
            dist/project_identity_v6.json \
            dist/project_identity_v6_integrity.json \
            dist/project_news_links_v6.json \
            dist/major_projects_v6.json \
            dist/major_project_news_v6.json \
            dist/renewables_v6_integrity.json \
            dist/renewables_v6_failure.txt \
            uk_renewables_pipeline/dashboard_v6_live.html
          if git diff --cached --quiet; then
            echo "No validated V6 changes to publish."
            exit 0
          fi
          git commit -m "V6 scope-validated REPD newspaper refresh: $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Persist fail-closed build stage
        if: failure()
        run: |
          git config user.name "Ventus-Bot"
          git config user.email "bot@ventus.ltd"
          stage="$(cat /tmp/v6_stage 2>/dev/null || echo unknown)"
          printf 'V6 build failed closed\nstage=%s\nutc=%s\n' "$stage" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > dist/renewables_v6_failure.txt
          git add dist/renewables_v6_failure.txt
          git diff --cached --quiet && exit 0
          git commit -m "V6 fail-closed diagnostic: ${stage}"
          git pull --rebase origin main
          git push origin HEAD:main
