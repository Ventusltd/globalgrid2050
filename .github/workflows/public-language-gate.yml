name: Public language gate

# Register entry 24: the rule that certain words must not appear in public text
# was enforced by reading, and reading does not enforce. On 20 September 2026
# the published manual carried twenty reserved words, every one inside a
# disclaimer written to protect the reader. Intent is not the test.
#
# SHELL NOTE, learned the hard way at 00:30 on 21 September: this runs on the
# MSI runners, where bash.exe is NOT on the machine PATH and pwsh is not
# installed. A step with `shell: bash` does not fail loudly - the step is
# skipped with "bash: command not found" and the gate silently checks nothing.
# Every step here uses `shell: powershell` (5.1). Do not change that without
# checking the runner PATH first.

#
# SPARSE NOTE, learned at 08:30 on 21 September: a self-hosted runner keeps its
# _work folder between jobs, so anything set in that clone STAYS SET. All twelve
# workspaces had core.sparseCheckout=true pinned to one unrelated file, left by
# some earlier job. actions/checkout happily checked out the right commit into a
# sliver of the tree: scripts/ did not exist, and the gate died on a missing
# file. It failed LOUDLY, which is the only reason nothing bad shipped - but for
# those runs the gate checked no language at all. A check that cannot run is not
# a pass, and it must not be able to look like a content failure either.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'status.html'
      - 'historical_builds.html'
      - 'compute/**'
      - 'kuiper-grid/**'
      - 'scripts/check_public_language.py'
      - '.github/workflows/public-language-gate.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # hourly, so a page that drifts is caught even without a push
    - cron: '35 * * * *'

permissions:
  contents: read

concurrency:
  group: public-language-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: [self-hosted, msi]
    timeout-minutes: 10
    steps:
      - name: The workspace must not be sparse
        shell: powershell
        run: |
          $w = "${{ github.workspace }}"
          if (Test-Path (Join-Path $w ".git")) {
            $sp = (& git -C $w config --get core.sparseCheckout) 2>$null
            if ($sp -eq "true") {
              Write-Host "This workspace was left sparse by an earlier job."
              Write-Host "Clearing it, because a partial tree makes a missing"
              Write-Host "check look exactly like a failed one."
              & git -C $w sparse-checkout disable
            }
          }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: The gate itself must be present
        shell: powershell
        run: |
          if (-not (Test-Path "scripts/check_public_language.py")) {
            Write-Host "FAIL: the gate script is not in this workspace."
            Write-Host "This is NOT a language failure. Nothing was checked."
            Write-Host "A check that cannot run is not a pass."
            exit 1
          }
          Write-Host "gate script present"

      - name: Python must be present
        shell: powershell
        run: |
          $py = Get-Command python -ErrorAction SilentlyContinue
          if (-not $py) {
            Write-Host "FAIL: python is not on this runner's PATH."
            Write-Host "A check that cannot run is not a pass."
            exit 1
          }
          Write-Host ("python: " + $py.Source)
          python --version

      - name: Show the published surface
        shell: powershell
        run: python scripts/check_public_language.py --list

      - name: Gate
        shell: powershell
        run: python scripts/check_public_language.py

      - name: What a failure means
        if: failure()
        shell: powershell
        run: |
          Write-Host "This page must not be published as it stands."
          Write-Host "Either the wording changes, or the rule does - deliberately,"
          Write-Host "in scripts/check_public_language.py, with a reason."
