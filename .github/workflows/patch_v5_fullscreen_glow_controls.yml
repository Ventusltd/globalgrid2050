name: Patch V5 Chart Glow Controls

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/patch_v5_fullscreen_glow_controls.py'
      - 'scripts/patch_v5_fullscreen_left_legend.py'
      - 'scripts/patch_v5_multi_year_loading.py'
      - 'scripts/patch_v5_trend_title_safe_zone.py'
      - 'scripts/patch_v5_emergency_chart_repair.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch V5 chart glow controls
        run: python scripts/patch_v5_fullscreen_glow_controls.py

      - name: Patch V5 fullscreen left legend
        run: python scripts/patch_v5_fullscreen_left_legend.py

      - name: Patch V5 multi year loading
        run: python scripts/patch_v5_multi_year_loading.py

      - name: Patch V5 trend title safe zone
        run: python scripts/patch_v5_trend_title_safe_zone.py

      - name: Patch V5 emergency chart repair
        run: python scripts/patch_v5_emergency_chart_repair.py

      - name: Syntax check JavaScript
        run: |
          node --check uk_energy_tracking_v5/price-history-ui.js
          node --check uk_energy_tracking_v5/price-history-fullscreen.js

      - name: Commit patched V5 chart files
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          set -e
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"
          git add uk_energy_tracking_v5/price-history-ui.js uk_energy_tracking_v5/price-history-fullscreen.js uk_energy_tracking_v5/index.md gridbot_reports/patch_v5_fullscreen_glow_controls.md gridbot_reports/patch_v5_fullscreen_left_legend.md gridbot_reports/patch_v5_multi_year_loading.md gridbot_reports/patch_v5_trend_title_safe_zone.md gridbot_reports/patch_v5_emergency_chart_repair.md
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Patch V5 chart glow controls"
            git pull --rebase https://${PAT}@github.com/${{ github.repository }}.git main
            git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
          else
            echo "No V5 chart glow changes to commit"
          fi
