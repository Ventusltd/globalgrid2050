name: Run V3 UI Patch

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply V3 UI patch
        run: python scripts/patch_v3_price_history_ui.py

      - name: Commit V3 UI changes
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          set -e
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"

          git add uk_energy_tracking_v3/index.md uk_energy_tracking_v3/price-history-ui.css uk_energy_tracking_v3/price-history-ui.js scripts/patch_v3_price_history_ui.py

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Run V3 UI patch"
            git pull --rebase https://${PAT}@github.com/${{ github.repository }}.git main
            git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
          else
            echo "No V3 UI changes to commit"
          fi
