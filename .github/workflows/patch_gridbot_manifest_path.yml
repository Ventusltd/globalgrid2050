name: Patch GridBot Manifest Path

on:
  workflow_dispatch:
    inputs:
      apply_fix:
        description: Apply and commit the GridBot manifest path hotfix
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: patch-gridbot-manifest-path
  cancel-in-progress: true

jobs:
  patch-gridbot-manifest-path:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GridBot manifest path hotfix audit
        if: github.event.inputs.apply_fix == 'false'
        run: python scripts/patch_gridbot_manifest_path.py

      - name: Apply GridBot manifest path hotfix
        if: github.event.inputs.apply_fix == 'true'
        run: python scripts/patch_gridbot_manifest_path.py --apply

      - name: Upload hotfix audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridbot-manifest-path-hotfix-audit
          path: |
            data_science_protocol/audit_reports/GRIDBOT_MANIFEST_PATH_HOTFIX_LATEST.md
            data_science_protocol/audit_reports/json/GRIDBOT_MANIFEST_PATH_HOTFIX_LATEST.json

      - name: Commit hotfix and audit report when approved
        if: github.event.inputs.apply_fix == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "Gridbot"
          git config --global user.email "gridbot@globalgrid2050.com"
          git add scripts/gridbot_mega_upgrade.py
          git add data_science_protocol/audit_reports/GRIDBOT_MANIFEST_PATH_HOTFIX_LATEST.md
          git add data_science_protocol/audit_reports/json/GRIDBOT_MANIFEST_PATH_HOTFIX_LATEST.json
          if git diff --cached --quiet; then
            echo "No GridBot hotfix changes to commit"
            exit 0
          fi
          git commit -m "fix: resolve GridBot manifest path handling"
          git pull --rebase origin main
          git push origin HEAD:main
