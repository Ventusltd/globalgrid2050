name: Create UK Energy Tracking V4

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  create-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build V4 from V3 benchmark
        run: python scripts/clone_v3_tracker_to_v4.py

      - name: Commit V4 clone
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Clone UK energy tracker V3 to V4
          file_pattern: uk_energy_tracking_v4/** scripts/update_uk_energy_v4.py scripts/update_uk_price_v4.py scripts/update_oil_prices_v4.py scripts/update_uk_fuel_prices_v4.py gridbot_reports/clone_uk_energy_tracking_v3_to_v4.md
