name: update-metal-prices

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: commodity-price-sync
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run LV price update
        run: python scripts/update_prices_lv.py

      - name: Run 33kV price update
        run: python scripts/update_prices.py

      - name: Run historic metal trends update
        run: python scripts/update_metal_trends.py

      - name: Run V5 commodity update
        run: FORCE_COMMODITIES=1 python scripts/update_commodities_v5.py

      - name: Commit and push commodity outputs
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          set -e

          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"

          git add lv_ac_dc_price_estimator/index.md
          git add 33kv_uk_dap_price_estimator/index.md
          git add copper_and_aluminium_prices_historic_trends.md
          git add uk_energy_tracking_v5/live_oil_prices.json
          git add uk_energy_tracking_v5/oil_price_history.geojson

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Automated commodity price update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase https://${PAT}@github.com/${{ github.repository }}.git main
            git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
          else
            echo "No commodity price changes to commit"
          fi
