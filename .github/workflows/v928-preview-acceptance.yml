name: V9.28 isolated preview acceptance

on:
  pull_request:
    paths:
      - 'automation/v928_*/**'
      - 'automation/news/**'
      - 'uk_renewables_pipeline/202611161757/**'
      - '.github/workflows/v928-preview-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v928-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      FIGURES_UI_DIR: ${{ github.workspace }}/external/TestCode/sandbox/filings-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Ventusltd/TestCode
          ref: b460cb7f76172691b5ffb6d2a7f1a8e12057ba20
          path: external/TestCode
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install bounded test dependencies
        run: |
          python -m pip install pytest==9.2.0 duckdb==1.3.2
          npm ci --prefix automation/news/acquisition/browser --ignore-scripts
          npm exec --prefix automation/news/acquisition/browser -- playwright install --with-deps chromium
          git fetch --depth 1 origin 65bcc01e0d7e4dc073e759345727e53cf7a95752 3cf3cc0fd1a0b14f46fc1eb7a16d2b01fb50f550
          echo "V928_OUT=$RUNNER_TEMP/v928-proof" >> "$GITHUB_ENV"
          echo "V928_PLAYWRIGHT=$GITHUB_WORKSPACE/automation/news/acquisition/browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Verify selected component bytes and Context export
        run: |
          python -B automation/v928_intelligence/verify_imports.py
          python -B automation/v928_context/build.py --figures-dir "$FIGURES_UI_DIR" --verify-validation
      - name: Native Python producer and corrected adapter contracts
        run: |
          python -B -m pytest -q -p no:cacheprovider automation/news/tests/test_v928_dc_data.py automation/news/tests/test_engine.py automation/news/tests/test_engine_independent.py automation/news/tests/test_transition_context.py automation/news/tests/test_grid_dc_context.py automation/news/tests/test_solar_dc_context.py automation/news/tests/test_policy_commitments.py automation/news/tests/test_filing_figures.py
          python -B -m unittest discover -s automation/news/tests -p test_grid_watch.py
      - name: Native Node component contracts
        run: node --test automation/news/datacentre-ui/tests/*.test.cjs automation/news/context-ui/adapter.test.mjs
      - name: Full canonical data, original MAP links and actual package budget
        run: node automation/v928_preview/invariants.mjs
      - name: Formal V9.28 source and rebuilt data runner on Linux
        run: bash uk_renewables_pipeline/202611161757/tests/run_v9_28.sh
      - name: Actual local-browser integration and negative source states
        run: node automation/v928_preview/browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v928-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/v928-proof
          retention-days: 7
