name: GridBot Solar Daily MWh Readability Upgrade

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audit first, apply after review
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
      commit_reports:
        description: Commit audit report and applied outputs
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

concurrency:
  group: gridbot-solar-daily-mwh-readability-upgrade
  cancel-in-progress: false

jobs:
  solar-daily-mwh-readability-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT }}

      - name: Audit Solar daily MWh readability upgrade
        if: github.event.inputs.mode == 'audit'
        run: python scripts/gridbot_solar_daily_mwh_readability_upgrade.py

      - name: Apply Solar daily MWh readability upgrade
        if: github.event.inputs.mode == 'apply'
        run: python scripts/gridbot_solar_daily_mwh_readability_upgrade.py --apply

      - name: Upload Solar daily MWh readability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-daily-mwh-readability-upgrade-report
          path: |
            data_science_protocol/audit_reports/SOLAR_DAILY_MWH_READABILITY_LATEST.md
            data_science_protocol/audit_reports/json/SOLAR_DAILY_MWH_READABILITY_LATEST.json

      - name: Commit Solar daily MWh readability outputs
        if: github.event.inputs.commit_reports == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "Gridbot"
          git config --global user.email "gridbot@globalgrid2050.com"
          git add scripts/gridbot_solar_daily_mwh_readability_upgrade.py || true
          git add .github/workflows/gridbot_solar_daily_mwh_readability_upgrade.yml || true
          git add uk_energy_tracking_v6/generation_history/index.md || true
          git add uk_energy_tracking_v6/generation_history/render_solar_daily_mwh_chart.js || true
          git add data_science_protocol/audit_reports/SOLAR_DAILY_MWH_READABILITY_LATEST.md || true
          git add data_science_protocol/audit_reports/json/SOLAR_DAILY_MWH_READABILITY_LATEST.json || true
          if git diff --cached --quiet; then
            echo "No Solar daily MWh readability outputs to commit"
            exit 0
          fi
          git commit -m "gridbot: solar daily mwh readability upgrade ${{ github.event.inputs.mode }}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
