name: GridBot London Solar Daylight Geometry

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
      year:
        description: Year to calculate, or auto
        required: true
        default: auto
      commit_reports:
        description: Commit reports and apply outputs
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
permissions:
  contents: write

concurrency:
  group: gridbot-london-solar-daylight-geometry
  cancel-in-progress: false

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT }}

      - name: Sync latest main before processing
        run: git pull --ff-only origin main

      - name: Run audit
        if: ${{ github.event.inputs.mode == 'audit' }}
        run: python scripts/gridbot_london_solar_daylight_geometry.py --year "${{ github.event.inputs.year }}"

      - name: Run apply
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: python scripts/gridbot_london_solar_daylight_geometry.py --year "${{ github.event.inputs.year }}" --apply

      - name: Upload daylight geometry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: london-solar-daylight-geometry-${{ github.event.inputs.mode }}
          path: |
            data_science_protocol/audit_reports/LONDON_SOLAR_DAYLIGHT_GEOMETRY_LATEST.md
            data_science_protocol/audit_reports/json/LONDON_SOLAR_DAYLIGHT_GEOMETRY_LATEST.json

      - name: Commit audit report only
        if: ${{ github.event.inputs.commit_reports == 'true' && github.event.inputs.mode == 'audit' }}
        run: |
          git config user.name "Gridbot"
          git config user.email "gridbot@users.noreply.github.com"
          git add scripts/gridbot_london_solar_daylight_geometry.py
          git add .github/workflows/gridbot_london_solar_daylight_geometry.yml
          git add data_science_protocol/audit_reports/LONDON_SOLAR_DAYLIGHT_GEOMETRY_LATEST.md
          git add data_science_protocol/audit_reports/json/LONDON_SOLAR_DAYLIGHT_GEOMETRY_LATEST.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "gridbot: london solar daylight geometry audit"
            git push origin HEAD:main
          fi

      - name: Commit daylight geometry output and report
        if: ${{ github.event.inputs.commit_reports == 'true' && github.event.inputs.mode == 'apply' }}
        run: |
          git config user.name "Gridbot"
          git config user.email "gridbot@users.noreply.github.com"
          git add scripts/gridbot_london_solar_daylight_geometry.py
          git add .github/workflows/gridbot_london_solar_daylight_geometry.yml
          git add uk_energy_tracking_v6/generation_history/london_solar_daylight_geometry_*.json
          git add data_science_protocol/audit_reports/LONDON_SOLAR_DAYLIGHT_GEOMETRY_LATEST.md
          git add data_science_protocol/audit_reports/json/LONDON_SOLAR_DAYLIGHT_GEOMETRY_LATEST.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "gridbot: london solar daylight geometry apply"
            git push origin HEAD:main
          fi
