name: Public language gate

# Register entry 24: the rule that certain words must not appear in public text
# was enforced by reading, and reading does not enforce. On 20 September 2026
# the published manual carried twenty reserved words, every one inside a
# disclaimer written to protect the reader. Intent is not the test.
#
# This check needs only Python, repository files and the public hash-pinned
# homepage bundle. Use a fresh hosted workspace so an offline private runner
# cannot leave the publication gate permanently queued.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'status.html'
      - 'historical_builds.html'
      - 'compute/**'
      - 'kuiper-grid/**'
      - 'scripts/check_public_language.py'
      - 'scripts/import_homepage_owner.py'
      - 'catalogue/homepage-owner.json'
      - '.github/workflows/public-language-gate.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # hourly, so a page that drifts is caught even without a push
    - cron: '35 * * * *'

permissions:
  contents: read

concurrency:
  group: public-language-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The gate itself must be present
        shell: bash
        run: |
          if [[ ! -f scripts/check_public_language.py || ! -f scripts/import_homepage_owner.py ]]; then
            echo "FAIL: a gate script is missing. Nothing was checked."
            echo "A check that cannot run is not a pass."
            exit 1
          fi
          echo "gate scripts present"

      - name: Python must be present
        shell: bash
        run: python --version

      - name: Assemble the hash-pinned homepage used by Pages
        shell: bash
        run: python scripts/import_homepage_owner.py

      - name: Show the published surface
        shell: bash
        run: python scripts/check_public_language.py --list

      - name: Gate
        shell: bash
        run: python scripts/check_public_language.py

      - name: What a failure means
        if: failure()
        shell: bash
        run: |
          echo "This page must not be published as it stands."
          echo "Either the wording changes, or the rule does - deliberately,"
          echo "in scripts/check_public_language.py, with a reason."
