name: GridBot MWh Mobile Bounds Repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
      commit_reports:
        description: Commit reports and apply outputs
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
permissions:
  contents: write

concurrency:
  group: gridbot-mwh-mobile-bounds-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT }}

      - name: Sync latest main before processing
        run: git pull --ff-only origin main

      - name: Run audit
        if: ${{ github.event.inputs.mode == 'audit' }}
        run: python scripts/gridbot_mwh_mobile_bounds_repair.py

      - name: Run apply
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: python scripts/gridbot_mwh_mobile_bounds_repair.py --apply

      - name: Upload mobile bounds report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mwh-mobile-bounds-repair-${{ github.event.inputs.mode }}
          path: |
            data_science_protocol/audit_reports/MWH_MOBILE_BOUNDS_REPAIR_LATEST.md
            data_science_protocol/audit_reports/json/MWH_MOBILE_BOUNDS_REPAIR_LATEST.json

      - name: Commit audit report only
        if: ${{ github.event.inputs.commit_reports == 'true' && github.event.inputs.mode == 'audit' }}
        run: |
          git config user.name "Gridbot"
          git config user.email "gridbot@users.noreply.github.com"
          git add scripts/gridbot_mwh_mobile_bounds_repair.py
          git add .github/workflows/gridbot_mwh_mobile_bounds_repair.yml
          git add data_science_protocol/audit_reports/MWH_MOBILE_BOUNDS_REPAIR_LATEST.md
          git add data_science_protocol/audit_reports/json/MWH_MOBILE_BOUNDS_REPAIR_LATEST.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "gridbot: mwh mobile bounds repair audit"
            git push origin HEAD:main
          fi

      - name: Commit mobile bounds changes and report
        if: ${{ github.event.inputs.commit_reports == 'true' && github.event.inputs.mode == 'apply' }}
        run: |
          git config user.name "Gridbot"
          git config user.email "gridbot@users.noreply.github.com"
          git add scripts/gridbot_mwh_mobile_bounds_repair.py
          git add .github/workflows/gridbot_mwh_mobile_bounds_repair.yml
          git add uk_energy_tracking_v6/generation_history/index.md
          git add data_science_protocol/audit_reports/MWH_MOBILE_BOUNDS_REPAIR_LATEST.md
          git add data_science_protocol/audit_reports/json/MWH_MOBILE_BOUNDS_REPAIR_LATEST.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "gridbot: mwh mobile bounds repair apply"
            git push origin HEAD:main
          fi
