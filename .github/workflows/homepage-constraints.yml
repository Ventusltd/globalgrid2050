name: Homepage constraints
# Decisions already taken about the front page, asserted rather than remembered.
# A later change that undoes one fails here instead of being noticed days later.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/test_homepage_constraints.py'
      - '.github/workflows/homepage-constraints.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  constraints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B scripts/test_homepage_constraints.py
