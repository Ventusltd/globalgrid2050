name: clone-uk-energy-tracking-v2

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  clone:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDBOT_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create V2 clone
        run: python scripts/clone_uk_energy_tracking_v2.py

      - name: Commit V2 clone
        env:
          PAT: ${{ secrets.GRIDBOT_PAT }}
        run: |
          git config --global user.name "gridbot"
          git config --global user.email "bot@globalgrid2050.com"
          git add uk_energy_tracking_v2/index.md
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Create UK energy tracker V2 clone"
            git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
          else
            echo "No changes to commit"
          fi
