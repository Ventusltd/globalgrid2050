<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Grid Atlas V9 — canonical application</title>
  <link rel="canonical" href="https://ventusltd.github.io/gridatlas/">
  <meta http-equiv="refresh" content="0; url=https://ventusltd.github.io/gridatlas/">
  <script>
    (() => {
      const target = new URL('https://ventusltd.github.io/gridatlas/');
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.href);
    })();
  </script>
</head>
<body>
  <main>
    <h1>Grid Atlas V9 has moved</h1>
    <p>This GlobalGrid2050 mirror is retired. <a id="canonical" href="https://ventusltd.github.io/gridatlas/">Open the canonical Grid Atlas V9 application.</a></p>
  </main>
  <script>
    const link = document.getElementById('canonical');
    const target = new URL(link.href);
    target.search = window.location.search;
    target.hash = window.location.hash;
    link.href = target.href;
  </script>
</body>
</html>
